<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #A6C8F8; overflow: hidden; }</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import { THREE, prog, easeInOut, easeOut, easeOutBack, lerp, V, bezier, pose, mixPose } from '/vendor/lib/stage.js';
import { MC, loadTheme, makeWorld, makeTerrain, makeBlock, makeFrame, pixelSprite, makeOrb, makeClouds, tex } from '/vendor/tema/mc.js';
import { loadMobs, planLife, makeLife, setTime } from '/vendor/tema/vida.js';

const walk = await (await fetch('/walk.json')).json();
// One clip for the whole video: times are absolute. The walk happens in [W0, W1]; the rest is a slow roam that
// ends where it starts, so the video still loops.
const subs = (await (await fetch('/timestamps.json')).json()).subtitles;
const seg = (i) => subs[i].start_s;
const TOTAL = subs[subs.length - 1].end_s;
const W0 = seg(walk.first), W1 = subs[walk.last].end_s;
const at = (spec) => seg(spec[0]) + spec[1];
const nodes = walk.nodes;
const imgs = await loadTheme(['grass_side', 'grass_top', 'dirt', 'planks', 'leaves', 'log_side', 'log_top', 'writable_book',
                              ...new Set(nodes.map((n) => (n.ore === 'stone' ? 'stone' : `${n.ore}_ore`)))]);
const T = { root: at(walk.root_in), keys: at(walk.keys_bar), toast: at(walk.toast), nine: at(walk.nine), complete: at(walk.complete) };
const FLY = 0.35;  // seconds a finished word takes to fly from its leaf to its chest slot (same in scenes.py)

// Events with absolute times; when each node is pushed and popped, and when each leaf is saved
const events = walk.events.map((e) => ({ ...e, T: at(e.t) }));
const pushT = {}, popT = {}, saveE = {};
events.forEach((e) => {
  if (e.kind === 'push') pushT[e.node] = e.T;
  if (e.kind === 'pop') popT[e.node] = e.T;
  if (e.kind === 'save') saveE[e.node] = e;
});
// When each block drops in: the root at the start, then every letter when the voice names it
const dropT = nodes.map((n, i) => {
  if (n.lvl === 0) return T.root;
  const spec = walk.drop[n.label];
  return at(spec) + (n.lvl === 2 ? 0.07 * Math.floor((i - 4) / 3) : 0);
});

const world = makeWorld({ fov: 40, offset: 0.34, fog: [55, 120] });
const { scene, camera } = world;
// Terrain of the ClaudeEntorno world (clearing with flowers by a mixed forest, see mundos/lugares.json); trees and
// plants are cleared where the camera stands
const terrain = await makeTerrain('/vendor/tema/mundos/flower-forest.json', { turn: 2.3562, plot: [-12, 12, -2, 20], clear: [-10, 10, 7, 24] });
scene.add(terrain);
const clouds = makeClouds(imgs);
scene.add(clouds);
// Daytime in the clearing: sheep, pigs and chickens on the grass, wolves by the forest
const LIFE = [{ kind: 'sheep', count: 3, graze: 1 }, { kind: 'pig', count: 2 }, { kind: 'chicken', count: 2 }, { kind: 'wolf', count: 2 }];
await loadMobs(imgs, LIFE.map((g) => g.kind));
const dim = await setTime(world, 'day', { terrain, clouds, imgs });
const life = makeLife(imgs, terrain, planLife(terrain, LIFE, { seed: 17 }), TOTAL, dim);
scene.add(life.g);
// Everything of the walk lives in its own group, hidden outside the walk
const stage = new THREE.Group();
scene.add(stage);

// Letter tree in the plane z = 0: the digits on top, a b c below, d e f under each of them
const SP = 1.1, SIZE = 0.9, Y0 = 6.2, DY = 2.5;
const spot = (i) => V(nodes[i].x * SP, Y0 - nodes[i].lvl * DY, 0);
const rodGeo = new THREE.BoxGeometry(0.11, 0.11, 1);
rodGeo.translate(0, 0, 0.5);
const rods = nodes.map((n, i) => {
  if (n.parent === null) return null;
  const mat = new THREE.MeshBasicMaterial({ map: tex(imgs, 'planks') });
  mat.color.setScalar(0.8);
  const r = new THREE.Mesh(rodGeo, mat);
  r.position.copy(spot(n.parent));
  r.lookAt(spot(i));
  r.userData.len = spot(n.parent).distanceTo(spot(i));
  stage.add(r);
  return r;
});
const blocks = nodes.map((n) => {
  const b = makeBlock(imgs, n.ore === 'stone' ? 'stone' : `${n.ore}_ore`, { size: SIZE, label: n.label });
  stage.add(b.g);
  return b;
});

// The block outline on the current end of the path: yellow while choosing, green on a complete word
const frame = makeFrame(SIZE + 0.06, 0.04, MC.yellow);
stage.add(frame);

// A finished word flies to its chest slot as a book and quill with the word under it
const bookMat = new THREE.SpriteMaterial({ map: tex(imgs, 'writable_book'), transparent: true, depthWrite: false });
const flyers = nodes.map((n) => {
  if (n.lvl !== 2) return null;
  const g = new THREE.Group();
  const book = new THREE.Sprite(bookMat);
  book.scale.set(0.5, 0.5, 1);
  const word = pixelSprite(n.path, MC.yellow, 0.3);
  word.position.y = -0.36;
  g.add(book, word);
  stage.add(g);
  return g;
});

// Experience orbs that burst from the leaves at the end
let seed = 17;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const orbs = Array.from({ length: 27 }, (_, n) => {
  const o = makeOrb(imgs, 0.34, [1, 2, 4, 5, 6][n % 5]);
  o.userData = { from: 4 + (n % 9), vx: (rnd() - 0.5) * 2.4, vy: 2.2 + rnd() * 2.0, vz: (rnd() - 0.3) * 2.0, delay: rnd() * 0.35 };
  stage.add(o);
  return o;
});

// Terrain materials are transparent (alpha-tested) and sorted with the sprites; sprites go last so the ground can't paint over them
stage.traverse((o) => { if (o.isSprite) o.renderOrder = 10; });

// Chest slot k of the 2D overlay (Inventory(9) at y = -1.15 in Manim's 9 x 12 frame), as a point in front of the camera
function slotPoint(k) {
  const xm = -3.52 + 0.88 * k, ym = -1.39;
  const ndc = V(xm / 4.5, ym / 6 * world.ndcY, 0.5);
  ndc.unproject(camera);
  const dir = ndc.sub(camera.position).normalize();
  return camera.position.clone().add(dir.multiplyScalar(7));
}

// Where the frame is: it glides to every pushed node and back to the parent on every pop
function frameSpot(t) {
  const p = spot(0);
  for (const e of events) {
    const target = e.kind === 'pop' ? nodes[e.node].parent : e.node;
    if (e.kind === 'save') continue;
    p.lerp(spot(target), easeInOut(prog(t, e.T - 0.12, e.T + 0.02)));
  }
  return p;
}

function onPath(i, t) {
  // 0..1: how much node i is part of the current path (pushed and not yet popped)
  if (i === 0) return 0;
  const a = pushT[i], b = popT[i];
  if (a === undefined || t < a - 0.1) return 0;
  return prog(t, a - 0.1, a + 0.05) * (1 - prog(t, b - 0.05, b + 0.1));
}

function renderAt(t) {
  // Walk camera: far and level so the whole tree fits in the top half; roam camera: one slow loop over the clearing
  const sway = 0.5 * Math.sin(t * 0.35);
  const walkPose = pose(V(sway, 5.4, 23.0), V(sway * 0.4, 5.75, 0.0));
  const a = 2 * Math.PI * t / TOTAL;
  const roamPose = pose(V(6 * Math.sin(a), 3.4 + 0.8 * Math.sin(2 * a), 13 + 2.5 * Math.cos(a)), V(3 * Math.sin(a), 4.2, -30));
  const k = easeInOut(prog(t, W0 - 1.6, W0 - 0.1)) * (1 - easeInOut(prog(t, W1 + 0.1, W1 + 1.6)));
  const cam = mixPose(roamPose, walkPose, k);
  world.look(cam.pos, cam.look);
  // The walk keeps its content high in the frame (the overlay uses the bottom); the roam shows more sky
  camera.setViewOffset(world.W, world.H, 0, world.H * lerp(0.12, 0.34, k), world.W, world.H);
  camera.updateMatrixWorld();
  clouds.position.x = 4 * Math.sin(a);
  life.update(t);
  stage.visible = t < W1;
  const fin = prog(t, T.toast, T.toast + 0.4);

  nodes.forEach((n, i) => {
    const p = spot(i);
    const d = prog(t, dropT[i], dropT[i] + 0.45);
    // On the path: bright; finished (popped) letters: darker, until the advancement lights them all again
    const path = onPath(i, t);
    const done = popT[i] !== undefined ? prog(t, popT[i], popT[i] + 0.2) * (1 - fin) : 0;
    let glow = 0.6 * path - 0.4 * done;
    if (i === 0) glow += 0.35 * Math.sin(Math.PI * prog(t, T.keys, T.keys + 0.7));
    const sv = saveE[i];
    if (sv) glow += 0.4 * Math.sin(Math.PI * prog(t, sv.T - 0.05, sv.T + 0.4));
    glow += fin * (0.2 + 0.1 * Math.sin(t * 6));
    blocks[i].g.position.set(p.x, p.y + (d < 1 ? (1 - d) * (1 - d) * 4 : 0), 0);
    blocks[i].set({ glow, opacity: d > 0 ? 1 : 0 });
    if (rods[i]) {
      // The rod grows down to its child as the child lands; rods on the path light up
      const g = prog(t, dropT[i] + 0.3, dropT[i] + 0.6);
      rods[i].visible = g > 0;
      rods[i].scale.set(1, 1, Math.max(rods[i].userData.len * g, 1e-4));
      const lit = path;
      rods[i].material.color.setRGB(0.8 + 0.7 * lit, 0.8 + 0.5 * lit, 0.8 - 0.45 * lit);
    }
    // A saved word flies from its leaf to its slot
    if (flyers[i]) {
      const f = sv ? prog(t, sv.T, sv.T + FLY) : 0;
      flyers[i].visible = f > 0 && f < 1;
      if (flyers[i].visible) {
        const q = slotPoint(sv.slot);
        flyers[i].position.copy(bezier(p.clone().add(V(0, 0, 0.6)), p.clone().lerp(q, 0.5).add(V(0, 1.2, 0)), q, easeInOut(f)));
      }
    }
  });

  // Frame: from the first choice until the advancement
  const first = events[0].T;
  frame.visible = t >= first - 0.12 && t < T.toast;
  frame.position.copy(frameSpot(t));
  // Green from the moment the word is complete (the first one when the voice says so), yellow on the way
  let leaf = false;
  for (const e of events) {
    if (t < e.T) break;
    const L = nodes[e.node].lvl === 2;
    leaf = e.kind === 'push' ? L && (e.node !== events[1].node || t >= T.complete) : e.kind === 'save';
  }
  if (t >= T.complete && events[1].T <= t && t < events[2].T) leaf = true;
  frame.userData.mat.color.setHex(leaf ? MC.green : MC.yellow);

  // Orbs burst from every leaf
  for (const o of orbs) {
    const { from: i, vx, vy, vz, delay } = o.userData;
    const u = t - (T.toast + delay);
    o.visible = u > 0 && u < 1.6;
    if (!o.visible) continue;
    const p = spot(i);
    o.position.set(p.x + vx * u, Math.max(p.y + vy * u - 4.5 * u * u, 0.1), vz * u);
    o.tint(t + delay);
    o.material.opacity = 1 - prog(u, 1.2, 1.6);
  }

  world.draw(t, TOTAL, 0, 0);
}

window.renderAt = renderAt;
window.sceneDuration = TOTAL;
</script>
</body>
</html>
