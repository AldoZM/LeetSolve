<script type="module">
// "How teams really use Git" (part 2), in the same savanna village and with the same pieces as part 1
// (videos/tech/git/three/git.html): Steve's house, commits as 1/8 models on pedestals tied with leads, banners as
// branches, the bell square as the remote. New here: a new builder (a mason villager) who clones into an empty yard,
// git diff frames on the real house, .gitignore bouncing a ladder and a secrets book off the chest, git stash in an
// ender chest, a fireplace commit undone with git revert, a deleted banner found with the reflog, a rebase that moves
// a model into one straight line, and a Pull Request on a lectern in the square (golem checks, Alex approves).
// Lighting: makeWorld({ shaders: true }). Animations copy the game's (objetos.js). ev(line, fraction) everywhere.
import { THREE, V, prog, easeInOut, pose } from '/vendor/lib/stage.js';
import { loadTheme, makeWorld, makeTerrain, makeClouds, makeSign, makeChest, makeFrame, makeOrb, tex } from '/vendor/tema/mc.js';
import { setTime, loadMobs } from '/vendor/tema/vida.js';
import { loadPeople, makePlayer, makeVillager, moveAlong, entityPart, skinMat } from '/vendor/tema/gente.js';
import { bubble, placeUI, smoothCamera, arc, makeItem, makeLectern } from '/vendor/tema/aldea.js';
import { makeBanner, makeLead, makeKnot, makeFencePost, makeDrop, makeCracks, swingArm, shakeNo } from '/vendor/tema/objetos.js';

// ---------- timing ----------
const subs = (await (await fetch('/timestamps.json')).json()).subtitles;
const TOTAL = subs[subs.length - 1].end_s;
const ev = (line, f = 0) => subs[line].start_s + f * subs[line].duration_s;
const end = (line) => subs[line].end_s;
const during = (t, a, z) => t >= a && t < z;

// ---------- world ----------
const PLACE = '/vendor/tema/mundos/savanna-village.json';
const imgs = await loadTheme(['grass_side', 'grass_top', 'dirt', 'leaves', 'log_side', 'log_top', 'glass', 'polished_andesite',
  'acacia_planks', 'banner_base', 'banner_pattern_base', 'lead_knot', 'clock', 'ladder', 'ender_atlas', 'barrier',
  'enchanted_book', 'padlock', 'fire', 'bricks', 'oak_planks', 'lectern_front', 'lectern_top', 'writable_book',
  ...Array.from({ length: 10 }, (_, i) => `destroy_stage_${i}`)]);
imgs.pickaxe = await new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.src = '/vendor/tema/gui/pickaxe.png'; });
await loadPeople(imgs, ['steve', 'alex', 'villager', 'type_savanna', 'prof_cartographer', 'prof_mason']);
await loadMobs(imgs, ['iron_golem']);
const world = makeWorld({ fov: 40, offset: 0, fog: [90, 220], shaders: true });
const { scene, camera } = world;
const village = await (await fetch(PLACE)).json();

// Steve's house is drawn by itself (it changes); the terrain keeps the rest as the game saved it
const inHouse = ([x, y, z, n]) => x >= 5 && x <= 11 && z >= 0 && z <= 6 && y >= 1 && y <= 10 && /acacia|terracotta|torch/.test(village.names[n]);
const houseBlocks = village.blocks.filter(inHouse).filter(([, , , n]) => !/torch/.test(village.names[n]))
  .map(([x, y, z, n]) => [x, y, z, village.names[n]]);
const ground = JSON.parse(JSON.stringify(village));
ground.blocks = ground.blocks.filter((b) => !inHouse(b));
const terrain = await makeTerrain(PLACE, { data: ground, clear: [1, 25, 7, 26] });
scene.add(terrain);
const clouds = makeClouds(imgs);
scene.add(clouds);
await setTime(world, 'day', { terrain, clouds, imgs });
world.sun.target.position.set(10, 0, 0);
const groundTop = (x, z) => Math.max(terrain.groundAt(x, z), terrain.groundAt(x + 0.4, z), terrain.groundAt(x - 0.4, z));
const G = 1;

// ---------- house states (same as part 1; part 2 starts where part 1 ended, state S9) ----------
const WIN_S = [8, 2, 5], WIN_E = [10, 2, 3], PEAK = [8, 9, 3];
const keyOf = (b) => `${b[0]},${b[1]},${b[2]}`;
const set = (blocks, changes) => {
  const out = new Map(blocks.map((b) => [keyOf(b), b]));
  for (const c of changes) { if (c[3] === null) out.delete(keyOf(c)); else out.set(keyOf(c), c); }
  return [...out.values()];
};
const pyramid = [];
for (let x = 6; x <= 10; x++) for (let z = 1; z <= 5; z++) pyramid.push([x, 8, z, 'red_wool']);
for (let x = 7; x <= 9; x++) for (let z = 2; z <= 4; z++) pyramid.push([x, 9, z, 'red_wool']);
pyramid.push([8, 10, 3, 'red_wool']);
const S3 = set(houseBlocks, [[...WIN_S, 'glass'], [...WIN_E, 'glass'], [...PEAK, 'glass']]);
const S6 = set(set(S3.filter((b) => b[1] < 8), pyramid), [[...PEAK, 'glowstone']]);
const CHIMNEY = [[10, 9, 1, 'bricks'], [10, 10, 1, 'bricks']];
const S7 = set(S6, CHIMNEY);
const S8 = set(S6, [[8, 10, 3, 'gold_block']]);
const S9 = set(S8, CHIMNEY);
const FIRES = [[10, 11, 1], [8, 11, 3], [6, 9, 2], [9, 10, 4]];
const S10 = set(S9, FIRES.map((p) => [...p, 'fire']));                           // the fireplace (bad commit)
const PORCH = [[7, 1, 7, 'acacia_planks'], [8, 1, 7, 'acacia_planks']];
const S12 = set(S9, PORCH);
const S9d = set(S9, [[...WIN_E, null]]);                                         // git diff: one glass removed

const EXTRA = ['glass', 'red_wool', 'glowstone', 'bricks', 'gold_block', 'fire'];
const names = [...village.names, ...EXTRA];
const looks = { ...village.looks, ...Object.fromEntries(EXTRA.map((n) => [n, { kind: 'cube', side: n }])), fire: { kind: 'cross', side: 'fire' } };
const toData = (blocks) => ({ names, looks, blocks: blocks.map(([x, y, z, n]) => [x - 8, y - 1, z - 3, names.indexOf(n)]) });
const houseGroup = async (blocks) => (blocks.length ? makeTerrain(PLACE, { data: toData(blocks) }) : new THREE.Group());
async function makeModel(blocks, parent) {
  const pk = new Set((parent ?? []).map((b) => b.join(',')));
  const g = new THREE.Group();
  const layers = [];
  for (let y = 1; y <= 11; y++) {
    const layer = blocks.filter((b) => b[1] === y);
    const L = { same: await houseGroup(layer.filter((b) => pk.has(b.join(',')))),
                changed: await houseGroup(layer.filter((b) => !pk.has(b.join(',')))) };
    g.add(L.same, L.changed);
    layers.push(L);
  }
  g.scale.setScalar(1 / 8);
  return { g, layers };
}
const HOUSE = {};
for (const [k, s] of Object.entries({ S9, S9d })) {
  HOUSE[k] = await houseGroup(s);
  HOUSE[k].position.set(8, 1, 3);
  HOUSE[k].visible = false;
  scene.add(HOUSE[k]);
}

// ---------- commits ----------
const C = {
  c6: { id: 'f2d1', msg: 'merge', s: S6, parents: [] },
  c7: { id: '7b3e', msg: 'chimney', s: S7, parents: ['c6'] },
  c8: { id: 'b06a', msg: 'gold top', s: S8, parents: ['c6'] },
  c9: { id: 'd4c9', msg: 'merge', s: S9, parents: ['c8', 'c7'] },
  c10: { id: 'b4d1', msg: 'fireplace', s: S10, parents: ['c9'] },
  c11: { id: 'e8a2', msg: 'revert b4d1', s: S9, parents: ['c10'] },
  c12: { id: '4f1c', msg: 'porch', s: S12, parents: ['c9'] },          // Steve's local branch, before the rebase
  c12r: { id: '8b27', msg: 'porch', s: S12, parents: ['c11'] },        // the same change replayed after main
  c13: { id: '1e5d', msg: 'merge #1', s: S12, parents: ['c11', 'c12r'] },
};
for (const c of Object.values(C)) c.model = await makeModel(c.s, c.parents[0] ? C[c.parents[0]].s : null);

// ---------- the copies of the repository ----------
const SPOT = { c6: [4, 9], c7: [7, 12.5], c8: [7, 9], c9: [10, 9], c10: [13, 9], c11: [16, 9], c12: [13, 12.5],
               c12r: [19, 9], c13: [22, 9] };
const REPOS = {
  steve: { at: [0, 0], spot: { ...SPOT } },
  remote: { at: [-10, -18], spot: { ...SPOT, c12r: [19, 12.5] } },     // the Pull Request waits on the side
  mason: { at: [18, -10], spot: { ...SPOT, c12r: [19, 12.5] } },
};
const HAS = { steve: {}, remote: {}, mason: {} };
const stoneMat = (h) => {
  const t = tex(imgs, 'polished_andesite').clone();
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1, h);
  t.needsUpdate = true;
  return new THREE.MeshBasicMaterial({ map: t });
};
const PIECES = {};
function makeSignFor(c) { return makeSign(imgs, [c.id, c.msg.length > 9 ? c.msg.slice(0, 9) : c.msg], { w: 0.86, h: 0.43, post: false }); }
for (const [r, R] of Object.entries(REPOS)) {
  const xz = (k) => [R.spot[k][0] + R.at[0], R.spot[k][1] + R.at[1]];
  const topY = Math.max(...Object.keys(C).map((k) => groundTop(...xz(k)))) + 1;
  for (const [k, c] of Object.entries(C)) {
    const [x, z] = xz(k);
    const g = new THREE.Group();
    const base = groundTop(x, z), h = topY - base;
    const col = new THREE.Mesh(new THREE.BoxGeometry(1, h, 1), [stoneMat(h), stoneMat(h), stoneMat(1), stoneMat(1), stoneMat(h), stoneMat(h)]);
    col.position.set(x, base + h / 2, z);
    g.add(col);
    const model = r === 'steve' ? c.model.g : c.model.g.clone();
    model.position.set(x, topY, z);
    g.add(model);
    const sign = makeSignFor(c);
    sign.position.set(x, topY - 0.5, z + 0.505);
    g.add(sign);
    const pbase = groundTop(x + 1, z);
    for (let y = pbase; y < topY - 0.01; y++) {
      const post = makeFencePost(imgs, 'acacia_planks');
      post.position.set(x + 1, y, z);
      g.add(post);
    }
    const knot = makeKnot(imgs);
    knot.position.set(x + 1, topY - 0.25, z);
    g.add(knot);
    g.visible = false;
    scene.add(g);
    PIECES[`${r}:${k}`] = { g, model, sign, col, topY, x, z, knotTop: V(x + 1, topY + 0.05, z) };
  }
}
const LEADS = [];
for (const r of Object.keys(REPOS)) for (const [k, c] of Object.entries(C)) for (const p of c.parents) {
  const l = makeLead({ width: 0.05 });
  l.material.color.setScalar(0.5);
  scene.add(l);
  LEADS.push({ r, k, p, l });
}
const BANNERS = [
  { r: 'steve', name: 'main', color: 'white', side: -1, keys: [] },
  { r: 'steve', name: 'chimney', color: 'orange', side: -1, keys: [] },
  { r: 'steve', name: 'porch', color: 'lime', side: -1, keys: [] },
  { r: 'remote', name: 'main', color: 'white', side: -1, keys: [] },
  { r: 'mason', name: 'main', color: 'white', side: -1, keys: [] },
];
for (const [i, b] of BANNERS.entries()) {
  b.ban = makeBanner(imgs, b.color, { seed: 11 + i * 29 });
  scene.add(b.ban.g);
  b.label = bubble([b.name], { color: { white: 0xFFFFFF, orange: 0xFFAA00, lime: 0x55FF55 }[b.color] });
  scene.add(b.label);
}

// ---------- people ----------
const steve = makePlayer(imgs, { skin: 'steve' });
const alex = makePlayer(imgs, { skin: 'alex' });
const keeper = makeVillager(imgs, { profession: 'cartographer', type: 'savanna' });
const mason = makeVillager(imgs, { profession: 'mason', type: 'savanna' });
scene.add(steve.g, alex.g, keeper.g, mason.g);
keeper.g.position.set(1.5, G, -6.0);
keeper.g.rotation.y = 0.3;
// the iron golem runs the checks (IronGolemModel, 128 x 128, as in the server short)
function makeGolem() {
  const mat = skinMat([imgs.mob_iron_golem]);
  const S = [128, 128];
  const g = new THREE.Group();
  const head = entityPart(mat, [0, -7, -2], [[0, 0, -4, -12, -5.5, 8, 10, 8], [24, 0, -1, -5, -7.5, 2, 4, 2]], [0, 0, 0], S);
  const body = entityPart(mat, [0, -7, 0], [[0, 40, -9, -2, -6, 18, 12, 11], [0, 70, -4.5, 10, -3, 9, 5, 6, 0.5]], [0, 0, 0], S);
  const arms = [entityPart(mat, [0, -7, 0], [[60, 21, -13, -2.5, -3, 4, 30, 6]], [0, 0, 0], S),
                entityPart(mat, [0, -7, 0], [[60, 58, 9, -2.5, -3, 4, 30, 6]], [0, 0, 0], S)];
  const legs = [entityPart(mat, [-4, 11, 0], [[37, 0, -3.5, -3, -3, 6, 16, 5]], [0, 0, 0], S),
                entityPart(mat, [5, 11, 0], [[60, 0, -3.5, -3, -3, 6, 16, 5]], [0, 0, 0], S)];
  g.add(head, body, ...arms, ...legs);
  scene.add(g);
  return { g, head, arms };
}
const golem = makeGolem();
golem.g.position.set(12.6, groundTop(12.6, -4.2), -4.2);
golem.g.rotation.y = -2.2;

// ---------- things ----------
const chest = makeChest(imgs, 0.9);
chest.g.position.set(11.5, G, 7.5);
chest.g.rotation.y = -0.6;
const ender = makeChest({ ...imgs, chest_atlas: imgs.ender_atlas }, 0.9);   // the stash box
ender.g.position.set(13.3, G, 7.6);
ender.g.rotation.y = -0.6;
scene.add(chest.g, ender.g);
const ignoreSign = makeSign(imgs, ['.gitignore', 'ladder', 'secrets'], { w: 1.1, h: 0.8 });
ignoreSign.position.set(10.3, G + 1.25, 8.4);
ignoreSign.rotation.y = -0.4;
scene.add(ignoreSign);
const barrier = makeItem(imgs, 'barrier', 0.8);
barrier.position.set(11.5, G + 1.5, 7.5);
scene.add(barrier);
// the temporary ladder on the east wall, and the secrets book on the grass
const ladder = new THREE.Mesh(new THREE.PlaneGeometry(1, 3), new THREE.MeshBasicMaterial({ map: tex(imgs, 'ladder'), transparent: true, alphaTest: 0.1, side: THREE.DoubleSide }));
ladder.material.map = ladder.material.map.clone(); ladder.material.map.wrapT = THREE.RepeatWrapping; ladder.material.map.repeat.set(1, 3); ladder.material.map.needsUpdate = true;
ladder.position.set(10.53, G + 1.5, 4);
ladder.rotation.y = Math.PI / 2;
scene.add(ladder);
const book = makeItem(imgs, 'enchanted_book', 0.55);
scene.add(book);
// git diff frames: green on the added bricks, red where the glass was
const frame = (color) => { const f = makeFrame(1.04, 0.05, color); f.visible = false; scene.add(f); return f; };
const ADDED = [[12, 1, 2], [12, 1, 4]];
const greens = ADDED.map(([x, y, z]) => { const f = frame(0x55FF55); f.position.set(x, y + 0.5, z); return f; });
const red = frame(0xFF5555);
red.position.set(WIN_E[0], WIN_E[1] + 0.5, WIN_E[2]);
const bricks = ADDED.map(([x, y, z]) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ map: tex(imgs, 'bricks') }));
  m.position.set(x, y + 0.5, z);
  m.visible = false;
  scene.add(m);
  return m;
});
// the porch blocks (git stash) and their flying copies
const porch = PORCH.map(([x, y, z]) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ map: tex(imgs, 'acacia_planks') }));
  m.position.set(x, y + 0.5, z);
  m.visible = false;
  scene.add(m);
  return m;
});
const porchDrops = PORCH.map((p, i) => { const d = makeDrop(imgs, 'acacia_planks', { offset: i * 1.9 }); scene.add(d); return d; });
// .gitignore: a bricks copy goes in; the ladder and the book bounce off the barrier
const inDrop = makeDrop(imgs, 'bricks');
const ladderDrop = makeDrop(imgs, 'ladder');
scene.add(inDrop, ladderDrop);
// fire on the real roof (fireplace commit): crossed planes with the game's animated fire strip (32 frames)
const fireTex = tex(imgs, 'fire').clone();
fireTex.repeat.set(1, 1 / 32);
fireTex.needsUpdate = true;
const fireMat = new THREE.MeshBasicMaterial({ map: fireTex, transparent: true, alphaTest: 0.1, side: THREE.DoubleSide, toneMapped: false });
const fires = FIRES.map(([x, y, z]) => {
  const g = new THREE.Group();
  for (const a of [Math.PI / 4, -Math.PI / 4]) { const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), fireMat); m.rotation.y = a; g.add(m); }
  g.position.set(x, y + 0.5, z);
  g.visible = false;
  scene.add(g);
  return g;
});
const cracks = makeCracks(imgs);
scene.add(cracks);
const pick = makeItem(imgs, 'pickaxe', 0.9);
scene.add(pick);
const lectern = makeLectern(imgs);
lectern.g.position.set(11.2, groundTop(11.2, -4.0), -4.0);
lectern.g.rotation.y = Math.PI * 0.75;
lectern.setBook(['Pull Request #1', 'porch -> main', '', 'checks: ...', 'review: ...']);
scene.add(lectern.g);
const reflog = makeLectern(imgs);
reflog.g.position.set(5.2, G, 12.6);
reflog.g.rotation.y = Math.PI * 0.85;
reflog.setBook(['git reflog', 'e8a2 revert b4d1', 'b4d1 fireplace', '7b3e chimney <-', 'd4c9 merge']);
scene.add(reflog.g);
const lock = makeItem(imgs, 'padlock', 0.7);
scene.add(lock);
const guard = [-0.6, 0, 0.6].map((dx) => { const p = makeFencePost(imgs, 'acacia_planks'); scene.add(p); p.userData.dx = dx; return p; });
const orbs = [0, 1, 2, 3, 4].map((i) => { const o = makeOrb(imgs, 0.3, i * 2); o.visible = false; scene.add(o); return o; });
const otherSign = makeSignFor({ id: '4f1c', msg: 'porch' });   // the old name of the rebased commit
scene.add(otherSign);

// ---------- cover ----------
const cover = makeSign(imgs, ['HOW TEAMS', 'USE GIT'], { w: 3.4, h: 1.6 });
const COVER_Z = 17;
const coverBase = groundTop(8, COVER_Z) + 2.0;
cover.position.set(8, coverBase, COVER_Z);
scene.add(cover);
const COVER_OUT = ev(0, 0.1), COVER_IN = ev(21, 0.7);
const coverY = (t) => coverBase - 4.5 * easeInOut(prog(t, COVER_OUT, COVER_OUT + 0.8)) * (1 - easeInOut(prog(t, COVER_IN, COVER_IN + 0.8)));

// ---------- events ----------
const T = {
  clone: [ev(2, 0.15), ev(2, 0.75)],
  diff: [ev(3, 0.2), end(3)],
  place: [ev(3, 0.1), ev(3, 0.18)],
  ignore: [ev(5, 0.15), ev(5, 0.55)],
  porch: [ev(6, 0.1), ev(6, 0.25)],
  bell: ev(6, 0.55),
  stash: [ev(7, 0.08), ev(7, 0.3)],
  pop: [ev(7, 0.68), ev(7, 0.9)],
  build10: [ev(8, 0.2), ev(8, 0.6)],
  fire: ev(8, 0.62),
  reset: [ev(10, 0.1), ev(10, 0.55)],
  build11: [ev(11, 0.2), ev(11, 0.5)],
  out: ev(11, 0.72),
  mainTo11: ev(11, 0.85),
  delBanner: ev(12, 0.3),
  replant: ev(13, 0.8),
  diamond: [ev(14, 0.3), end(14)],
  build12: [ev(15, 0.05), ev(15, 0.2)],
  rebase: [ev(15, 0.35), ev(15, 0.7)],
  guard: ev(17, 0.3),
  push: [ev(18, 0.05), ev(18, 0.35)],
  lectern: ev(18, 0.55),
  checks: [ev(19, 0.05), ev(19, 0.45)],
  approve: ev(19, 0.75),
  build13: [ev(20, 0.15), ev(20, 0.35)],
  mainTo13: ev(20, 0.4),
  pullAll: [ev(20, 0.5), ev(20, 0.95)],
};
// Who has what: Steve and the remote start with commits 6 to 9 (part 1); the mason clones them
Object.assign(HAS.steve, { c6: 0, c7: 0, c8: 0, c9: 0, c10: T.build10[0], c11: T.build11[0], c12: T.build12[0] });
Object.assign(HAS.remote, { c6: 0, c7: 0, c8: 0, c9: 0, c10: ev(10, 0.0), c11: ev(13, 0.2), c13: T.build13[0] });
const BUILDS = { c10: T.build10, c11: T.build11, c12: T.build12 };
const FLIGHTS = [];
function fly(k, from, to, a, z) {
  const m = C[k].model.g.clone();
  m.visible = false;
  scene.add(m);
  FLIGHTS.push({ k, from, to, a, z, m });
  HAS[to][k] = z;
}
['c6', 'c7', 'c8', 'c9'].forEach((k, i) => fly(k, 'remote', 'mason', T.clone[0] + i * 0.12 * (T.clone[1] - T.clone[0]),
                                                T.clone[0] + (0.55 + i * 0.12) * (T.clone[1] - T.clone[0])));
fly('c12r', 'steve', 'remote', ...T.push);
['c10', 'c11', 'c12r', 'c13'].forEach((k, i) => fly(k, 'remote', 'mason', T.pullAll[0] + i * 0.1 * (T.pullAll[1] - T.pullAll[0]),
                                                     T.pullAll[0] + (0.6 + i * 0.1) * (T.pullAll[1] - T.pullAll[0])));
fly('c13', 'remote', 'steve', T.pullAll[0], T.pullAll[0] + 0.7 * (T.pullAll[1] - T.pullAll[0]));
// the rebase: commit 12 moves from its side spot to the front of main (and becomes c12r)
HAS.steve.c12r = T.rebase[1];

BANNERS[0].keys = [[0, 'c9'], [T.mainTo11, 'c11'], [T.pullAll[1], 'c13']];
BANNERS[1].keys = [[0, 'c7'], [T.delBanner, null], [T.replant, 'c7']];
BANNERS[2].keys = [[T.build12[1], 'c12'], [T.rebase[1] + 0.1, 'c12r']];
BANNERS[3].keys = [[0, 'c9'], [ev(13, 0.2), 'c11'], [T.mainTo13, 'c13']];
BANNERS[4].keys = [[T.clone[1], 'c9'], [T.pullAll[1], 'c13']];

// ---------- per frame ----------
function layered(md, t, [a, z]) {
  const n = md.layers.length;

  ...dig(...T.reset, 3, 'stone_dig', 0.3), [T.reset[1], 'villager_no3', 0.3],
  ...dig(...T.build11, 4), [T.build11[1], 'lead_tie', 0.3], [T.out, 'fizz', 0.4], [T.mainTo11, 'wood_dig4', 0.3],
  [T.delBanner, 'break', 0.3], [ev(13, 0.05), 'book_flip1', 0.3], [T.replant, 'wood_dig1', 0.35],
  [T.diamond[0], 'orb', 0.2], ...dig(...T.build12, 2), [T.rebase[0], 'click', 0.2], [T.rebase[1], 'pop', 0.3],
  [T.rebase[1] + 0.1, 'lead_tie', 0.3], [ev(16, 0.1), 'villager_no1', 0.25],
  [T.guard, 'wood_dig3', 0.3], [T.guard + 0.2, 'chest_locked', 0.3],
  [T.lectern, 'book_flip2', 0.3], [T.checks[0], 'orb', 0.25], [T.checks[0] + 0.5, 'orb', 0.2], [T.checks[1], 'levelup', 0.2],
  [T.approve, 'villager_yes2', 0.3], ...dig(...T.build13, 3), [T.mainTo13, 'bell', 0.35], [T.mainTo13 + 0.2, 'challenge', 0.25],
  [COVER_IN, 'wood_dig2', 0.3], [ev(22, 0.05), 'orb', 0.3],
].map(([s, n, g]) => [Math.round(s * 1000) / 1000, n, g]);

// Smooth camera (Aldo's request for part 2): the key path blurred in time, with a slow sway while waiting
const camAt = smoothCamera(CAM, TOTAL, { sigma: 0.5 });
// The loop: in the last line everything goes back to the first frame's state behind the cover
const LOOP_T = ev(22, 0.05);
window.renderAt = (t) => {
  scenePieces(t >= LOOP_T ? 0 : t);
  cover.position.y = coverY(t);
  const cam = camAt(t);
  world.look(cam.pos, cam.look);
  camera.updateMatrixWorld();
  bubbles(t >= LOOP_T ? 0 : t);
  placeUI(camera);
  clouds.position.x = 4 * Math.sin(2 * Math.PI * t / TOTAL);
  world.draw(t, TOTAL, 0, 0);
};
window.sceneDuration = TOTAL;
</script>
