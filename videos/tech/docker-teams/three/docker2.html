const loadImg = (src) => new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.src = src; });
const pixelMap = (img, sx = 0, sy = 0, w = img.width, h = img.height) => {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, sx, sy, w, h, 0, 0, w, h);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
};
const basic = (map, extra = {}) => new THREE.MeshBasicMaterial({ map, transparent: true, alphaTest: 0.1, ...extra });

// Shulker box (ShulkerModel without head), as in part 1; ghost boxes are see-through (layers already there)
function makeShulker(color, { ghost = false } = {}) {
  const mat = basic(pixelMap(imgs[`shulker_${color}`]), ghost ? { opacity: 0.32, depthWrite: false, alphaTest: 0 } : {});
  const base = entityPart(mat, [0, 24, 0], [[0, 28, -8, -8, -8, 16, 8, 16]]);
  const lid = entityPart(mat, [0, 24, 0], [[0, 0, -8, -16, -8, 16, 12, 16]]);
  const g = new THREE.Group();
  g.add(base, lid);
  return { g, mat };
}
const stackOf = (colors, at, opts = {}) => colors.map((c, i) => {
  const s = makeShulker(c, opts);

  scene.add(s.g);

});

// Lantern block model (template_lantern), as in part 1
const lanternMap = pixelMap(imgs.lantern, 0, 0, 16, 16);
function uvBox(w, h, d, side, top) {
  const geo = new THREE.BoxGeometry(w / 16, h / 16, d / 16);
  const uv = geo.attributes.uv;
  for (let f = 0; f < 6; f++) {
    const [u0, v0, u1, v1] = f === 2 || f === 3 ? top : side;
    for (let k = 0; k < 4; k++) {
      const i = f * 4 + k;
      uv.setXY(i, (u0 + uv.getX(i) * (u1 - u0)) / 16, 1 - (v0 + (1 - uv.getY(i)) * (v1 - v0)) / 16);
    }
  }
  return geo;
}
function makeLantern() {
  const g = new THREE.Group();
  const mat = basic(lanternMap);
  const body = new THREE.Mesh(uvBox(6, 7, 6, [0, 2, 6, 9], [0, 9, 6, 15]), mat);
  body.position.y = 3.5 / 16;
  const cap = new THREE.Mesh(uvBox(4, 2, 4, [1, 0, 5, 2], [1, 10, 5, 14]), mat);
  cap.position.y = 8 / 16;
  g.add(body, cap);
  return g;
}

// Boat (BoatModel, 128 x 64), as in part 1: length along x, origin on the water line
function makeBoat() {
  const mat = basic(pixelMap(imgs.boat_oak));
  const S = [128, 64], P = Math.PI;
  const m = new THREE.Group();
  m.add(entityPart(mat, [0, 3, 1], [[0, 0, -14, -9, -3, 28, 16, 3]], [P / 2, 0, 0], S),
        entityPart(mat, [-15, 4, 4], [[0, 19, -13, -7, -1, 18, 6, 2]], [0, 3 * P / 2, 0], S),
        entityPart(mat, [15, 4, 0], [[0, 27, -8, -7, -1, 16, 6, 2]], [0, P / 2, 0], S),
        entityPart(mat, [0, 4, -9], [[0, 35, -14, -7, -1, 28, 6, 2]], [0, P, 0], S),
        entityPart(mat, [0, 4, 9], [[0, 43, -14, -7, -1, 28, 6, 2]], [0, 0, 0], S));
  m.position.y = -1.125 + 0.2;
  const g = new THREE.Group();
  g.add(m);
  scene.add(g);
  return g;
}

// Hopper (block model hopper.json): the 16 x 6 x 16 bowl on top, the 8 x 6 x 8 middle and the 4 x 4 x 4 spout down
function makeHopper() {
  const side = tex(imgs, 'hopper_outside');
  const g = new THREE.Group();
  const part = (w, h, d, y, top = side) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w / 16, h / 16, d / 16), faceMatsFor(side, top, side));
    m.position.y = y / 16;
    g.add(m);
  };
  part(16, 6, 16, 13, tex(imgs, 'hopper_top'));
  part(8, 6, 8, 7);
  part(4, 4, 4, 2);
  return g;
}

// Iron golem (IronGolemModel, 128 x 128, as in the Git and server shorts); arms swing while it runs the tests
function makeGolem() {
  const mat = skinMat([imgs.mob_iron_golem]);
  const S = [128, 128];
  const g = new THREE.Group();
  const head = entityPart(mat, [0, -7, -2], [[0, 0, -4, -12, -5.5, 8, 10, 8], [24, 0, -1, -5, -7.5, 2, 4, 2]], [0, 0, 0], S);
  const body = entityPart(mat, [0, -7, 0], [[0, 40, -9, -2, -6, 18, 12, 11], [0, 70, -4.5, 10, -3, 9, 5, 6, 0.5]], [0, 0, 0], S);
  const arms = [entityPart(mat, [0, -7, 0], [[60, 21, -13, -2.5, -3, 4, 30, 6]], [0, 0, 0], S),
                entityPart(mat, [0, -7, 0], [[60, 58, 9, -2.5, -3, 4, 30, 6]], [0, 0, 0], S)];
  const legs = [entityPart(mat, [-4, 11, 0], [[37, 0, -3.5, -3, -3, 6, 16, 5]], [0, 0, 0], S),
                entityPart(mat, [5, 11, 0], [[60, 0, -3.5, -3, -3, 6, 16, 5]], [0, 0, 0], S)];
  g.add(head, body, ...arms, ...legs);

}

const smokeMaps = [tex(imgs, 'big_smoke_0'), tex(imgs, 'big_smoke_4')];
function makeStall({ python = 'blue_wool', lantern = true, prof = 'cleric', counterItem = 'emerald' } = {}) {
  const g = new THREE.Group();
  const keeper = makeVillager(imgs, { profession: prof, type: 'plains' });
  g.add(keeper.g);
  const parts = { python: put(imgs, g, python, 1, 0, 0), counter: put(imgs, g, 'oak_planks', 0, 0, 1) };
  parts.lantern = makeLantern();
  parts.lantern.position.set(1, 1, 0);
  parts.lantern.visible = lantern;
  g.add(parts.lantern);
  const item = makeItem(imgs, counterItem, 0.42);
  g.add(item);
  const sparks = Array.from({ length: 4 }, () => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex(imgs, 'trade_glint'), color: 0x66FF66, transparent: true, depthWrite: false }));
    s.scale.setScalar(0.16);
    g.add(s);
    return s;
  });
  const smoke = Array.from({ length: 8 }, (_, i) => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeMaps[i % 2], color: 0x606060, transparent: true, depthWrite: false }));
    g.add(s);
    return s;
  });
  const st = { g, keeper, parts };
  st.update = (t, { sell = false, crash = false, seed = 0 } = {}) => {
    const ph = ((t + seed) % 1.6) / 1.6;
    item.visible = sell && ph < 0.7;
    if (item.visible) { item.position.set(0, 1.25 + 0.5 * ph, 1); item.material.opacity = 1 - prog(ph, 0.5, 0.7); }
    keeper.head.rotation.x = sell ? 0.25 * Math.max(0, Math.sin(ph * Math.PI * 4)) : keeper.head.rotation.x;
    sparks.forEach((s, i) => {
      const q = (ph + i * 0.25) % 1;
      s.visible = sell;
      s.position.set(Math.sin(i * 2.1) * 0.45, 1.9 + q * 0.6, 0.1 + Math.cos(i * 2.1) * 0.35);
      s.material.opacity = 1 - q;
    });
    smoke.forEach((s, i) => {
      const q = ((t + seed) * 0.45 + i / smoke.length) % 1;
      s.visible = crash;
      s.position.set(1 + Math.sin(i * 1.7 + q * 3) * 0.3, 1.0 + q * 2.4, Math.cos(i * 2.3) * 0.25);
      s.scale.setScalar(0.6 + q * 0.9);
      s.material.opacity = 0.85 * (1 - q);
    });
    shakeNo(keeper, t, crash);
    if (!crash && !sell) keeper.head.rotation.x = 0;
  };
  return st;
}

// ---------- glass rooms (containers), as in part 1 ----------
function makeRoom(a, b, y0, stallOpts) {
  const g = new THREE.Group();
  const panes = [];
  for (let y = 0; y < 2; y++) for (let x = a; x <= a + 3; x++) for (let z = b; z <= b + 3; z++) {
    if (x > a && x < a + 3 && z > b && z < b + 3) continue;
    panes.push(put(imgs, g, 'glass', x, y0 + y, z));
  }
  const stall = makeStall(stallOpts);
  stall.g.position.set(a + 1, y0, b + 1);
  g.add(stall.g);
  const sheet = new THREE.Mesh(new THREE.BoxGeometry(4, 0.14, 4),
    new THREE.MeshBasicMaterial({ color: 0x7FC8FF, transparent: true, opacity: 0.55, depthWrite: false }));
  sheet.position.set(a + 1.5, y0 + 2.07, b + 1.5);
  sheet.visible = false;
  g.add(sheet);
  g.visible = false;
  scene.add(g);
  const r = { g, panes, stall, sheet, center: V(a + 1.5, y0, b + 1.5) };
  r.build = (k) => panes.forEach((p, i) => { p.visible = k * panes.length > i; });
  return r;
}

// ---------- per frame ----------
function glow(g, k) {
  g.traverse((o) => {
    if (!o.material) return;
    for (const m of Array.isArray(o.material) ? o.material : [o.material]) {
      if (!m.color) continue;
      if (!m.userData.base0) m.userData.base0 = m.color.clone();
      m.color.copy(m.userData.base0).multiplyScalar(1 + k);
    }
  });
}
const pulse = (t, a, z, period = 1.2) => (during(t, a, z) ? 0.6 * (0.5 - 0.5 * Math.cos((t - a) * 2 * Math.PI / period)) : 0);
const pop = (t, a) => Math.max(1e-3, easeInOut(Math.min(1, Math.max(0, (t - a) / 0.2))));

// A boat from keys [time, place]: glides between places (eased), turned along the leg it is on
function boatAt(b, keys, t, yaw0 = 0) {
  let p = keys[0][1].clone(), yaw = yaw0;
  for (let i = 0; i + 1 < keys.length; i++) {
    const [t0, a] = keys[i], [t1, z] = keys[i + 1];
    if (a.distanceTo(z) < 1e-3) continue;
    if (t >= t0) { yaw = Math.atan2(-(z.z - a.z), z.x - a.x); p = a.clone().lerp(z, easeInOut(prog(t, t0, t1))); }
  }
  b.position.copy(p);
  b.position.y = WATER + 0.06 * Math.sin(t * 2.2 + p.x);
  b.rotation.y = yaw;
}
// Boxes carried by boat: from their places onto the boat, then off the boat to their new places
function carry(boxes, t, { from, boat, to, load, land, show = [load[0], land[1]] }) {
  const lk = prog(t, ...load), dk = prog(t, ...land);
  boxes.forEach((s, i) => {
    s.g.visible = during(t, ...show);
    if (!s.g.visible) return;
    const onBoat = boat.position.clone().add(V(0, 0.15 + i * 0.5, 0));
    if (lk < 1) s.g.position.copy(arc(from(i), onBoat, easeInOut(lk), 2));
    else if (dk <= 0) s.g.position.copy(onBoat);
    else s.g.position.copy(arc(onBoat, to(i), easeInOut(dk), 2));
    s.g.scale.setScalar(dk > 0 ? 0.5 + 0.5 * dk : 0.5 + 0.5 * (1 - lk));
  });
}

// The shop's room: up at the start, broken (line 4), up again (line 5), broken and up again (line 7)
const shopK = (t) => {
  if (t < T.del1[0]) return 1;
  if (t < T.reb1[0]) return 1 - prog(t, ...T.del1);
  if (t < T.del2[0]) return prog(t, ...T.reb1);
  if (t < T.reb2[0]) return 1 - prog(t, ...T.del2);
  return prog(t, ...T.reb2);
};

function scenePieces(t) {
  // Steve's image on the beach, Alex's blog image next to hers
  steveStack.forEach((s) => { s.g.visible = true; });
  alexBlog.forEach((s) => { s.g.visible = true; });
  shelfBlog.forEach((s) => { s.g.visible = true; });

  // push (line 2): a copy of Steve's stack goes on boat A, sails to the harbor and is shelved as shop:1.2
  boatAt(boatA, [[0, DOCK], [T.push.sail[0], DOCK], [T.push.sail[1], MOOR_E], [T.pull.sail[0], MOOR_E], [T.pull.sail[1], DOCK]], t, Math.PI / 2);
  carry(cargoPush, t, { from: (i) => STACK.clone().add(V(0, i, 0)), boat: boatA, to: (i) => SLOT[1].clone().add(V(0, i, 0)),
                        load: T.push.load, land: T.push.land });
  shelf12.forEach((s, i) => { s.g.visible = t >= T.push.land[1]; });
  TAGS[1].visible = t >= T.push.land[1] - 0.05;
  TAGS[1].scale.setScalar(0.85 * pop(t, T.push.land[1] - 0.05));
  // pull (line 3): only the two layers Alex doesn't have travel; the two she has light up as ghosts tied to hers
  carry(cargoPull, t, { from: (i) => SLOT[1].clone().add(V(0, i + 2, 0)), boat: boatA, to: (i) => ALEXSHOP.clone().add(V(0, i + 2, 0)),
                        load: T.pull.load, land: T.pull.land });
  alexNew.forEach((s) => { s.g.visible = t >= T.pull.land[1]; });
  alexGhost.forEach((s, i) => { s.g.visible = t >= T.pull.ghost; s.g.scale.setScalar(pop(t, T.pull.ghost)); });
  skipLeads.forEach((l, i) => {
    if (t < T.pull.ghost || t >= end(3)) { l.visible = false; return; }
    l.set(ALEXSTACK.clone().add(V(0.5, i + 0.5, 0)), ALEXSHOP.clone().add(V(-0.5, i + 0.5, 0)), easeInOut(prog(t, T.pull.ghost, T.pull.ghost + 0.5)));
  });
  const skipGlow = pulse(t, T.pull.ghost, end(3));
  for (const i of [0, 1]) { glow(alexBlog[i].g, skipGlow); glow(alexGhost[i].g, skipGlow); }

  // the shop's container: orders written on its own layer (line 4), lost when it is deleted
  const k = shopK(t);
  SHOP.g.visible = true;
  SHOP.build(k);
  const shopUp = k >= 1;
  SHOP.stall.g.visible = shopUp;
  SHOP.stall.update(t, { sell: shopUp && t < ev(13, 0) && !during(t, T.reb2[1], T.plug), seed: 0.3 });
  SHOP.sheet.visible = during(t, T.orders[0], T.del1[0] + 0.02);
  SHOP.sheet.material.opacity = 0.55 * prog(t, T.orders[0], T.orders[0] + 0.3);
  // papers 0..2: onto the sheet (line 4); 3..5: into the hopper and down to the barrel (line 6); 6..8: out of the barrel (line 7)
  paperBits.forEach((p) => { p.visible = false; });
  T.orders.forEach((a, i) => {
    const p = paperBits[i], rest = V(4.7 + 0.6 * i, FL + 2.22, 3.2 + 0.25 * i);
    const kk = prog(t, a, a + 0.45);
    p.visible = t >= a && t < T.del1[0] + 0.02;
    if (p.visible) p.position.copy(kk < 1 ? arc(COUNTER, rest, easeInOut(kk), 0.8) : rest);
  });
  T.feed.forEach((a, i) => {
    const p = paperBits[3 + i], top = BARREL.clone().add(V(0, 2.1, 0)), inside = BARREL.clone().add(V(0, 0.6, 0));
    const k1 = prog(t, a, a + 0.45), k2 = prog(t, a + 0.45, a + 0.7);
    p.visible = k1 > 0 && k2 < 1;
    if (p.visible) p.position.copy(k1 < 1 ? arc(COUNTER, top, easeInOut(k1), 1.0) : top.clone().lerp(inside, k2));
  });
  [0, 1, 2].forEach((i) => {
    const p = paperBits[6 + i], a = T.open + 0.08 * i;
    const kk = prog(t, a, a + 0.4), back = prog(t, end(7) - 0.4, end(7));
    p.visible = kk > 0 && back < 1;
    if (p.visible) p.position.copy(BARREL.clone().add(V((i - 1) * 0.45, 0.6 + 2.0 * easeInOut(kk) * (1 - easeInOut(back)), 0.6)));
  });
  // the volume: barrel and hopper placed in line 6 and kept; they glow when the new container plugs in (line 7)
  barrel.g.visible = t >= T.barrel;
  barrel.g.scale.setScalar(pop(t, T.barrel));
  hopper.visible = t >= T.hopper;
  hopper.scale.setScalar(pop(t, T.hopper));
  barrel.mats[2].map = during(t, T.open, end(7)) ? openMap : shutMap;
  const plugGlow = pulse(t, T.plug, ev(7, 0.8), 0.8) + pulse(t, T.feed[0], ev(6, 0.95), 1.0) * 0.5;
  glow(barrel.g, plugGlow);
  glow(hopper, plugGlow);

  // Compose (lines 9 and 10): the book opens; db and cache go up together, the shop's room glows with them
  lectern.open(prog(t, T.book, T.book + 0.3) * (1 - prog(t, ev(13, 0), ev(13, 0) + 0.3)));
  for (const R of [DB, CACHE]) {
    R.g.visible = t >= T.up[0];
    R.build(prog(t, ...T.up));
    R.stall.g.visible = t >= T.up[1];
    R.stall.update(t, { sell: t >= T.up[1] + 0.3 && t < ev(13, 0), seed: R === DB ? 0.8 : 1.3 });
  }
  glow(SHOP.g, pulse(t, T.up[0], ev(10, 0.8), 0.9));

  // the network (line 11): rails laid, stations, the fence; the cart rides from shop to db
  const rk = prog(t, ...T.rails);
  railBits.forEach((m, i) => { m.visible = rk * railBits.length > i; });
  STATIONS.forEach((s, i) => { s.visible = t >= T.rails[0] + 0.1 * i; s.scale.setScalar(0.9 * pop(t, T.rails[0] + 0.1 * i)); });
  const fk = prog(t, ...T.fence);
  posts.forEach((p, i) => { p.visible = fk * posts.length > i; });
  gate.visible = fk >= 1;
  const gk = easeInOut(prog(t, T.gate, T.gate + 0.3));
  gateHalves.forEach((h, i) => { h.rotation.y = (i === 0 ? -1 : 1) * gk * Math.PI / 2; });
  glow(gate, pulse(t, T.gate, end(12), 1.0));
  cart.g.visible = t >= T.rails[1];
  if (cart.g.visible) cart.place(ROUTE, 5 + 5 * easeInOut(prog(t, ...T.ride)));

  // the pipeline (line 14): boxes placed one by one at the harbor, the golem checks, the stack is shelved as 1.3
  built13.forEach((s, i) => {
    s.g.visible = t >= T.pipe[i];
    s.g.scale.setScalar(pop(t, T.pipe[i]));
    const sk = easeInOut(prog(t, ...T.shelve));
    s.g.position.copy(arc(BUILD.clone().add(V(0, i, 0)), SLOT[2].clone().add(V(0, i, 0)), sk, 1.5));
  });
  built13.forEach((s) => glow(s.g, during(t, T.tests[0] + 0.15, T.tests[1] + 0.3) ? 0.45 : 0));
  TAGS[2].visible = t >= T.shelve[1];
  TAGS[2].scale.setScalar(0.85 * pop(t, T.shelve[1]));
  golem.arms.forEach((a, i) => { a.rotation.x = during(t, ...T.tests) ? -0.6 * Math.sin((t - T.tests[0]) * 6 + i * Math.PI) : 0; });
  golem.head.rotation.y = 0.25 * Math.sin(t * 0.8);
  builder.head.rotation.x = during(t, T.pipe[0] - 0.2, T.pipe[3] + 0.3) ? 0.3 : 0;

  // deploy (line 15): boat B takes a copy of 1.3 to the server, which runs it
  boatAt(boatB, [[0, S1], [T.deploy.sail[0], S1], [T.deploy.sail[1], PIER]], t, 0);
  carry(cargo13, t, { from: (i) => SLOT[2].clone().add(V(0, i, 0)), boat: boatB, to: (i) => SERVERSTACK.clone().add(V(0, i, 0)),
                      load: T.deploy.load, land: T.deploy.land });
  server13.forEach((s) => { s.g.visible = during(t, T.deploy.land[1], T.roll.land[0]); });
  SRV.g.visible = t >= T.deploy.run[0];
  SRV.build(prog(t, ...T.deploy.run));
  SRV.stall.g.visible = t >= T.deploy.run[1];
  const crashing = during(t, T.crash, T.roll.fixed);
  SRV.stall.update(t, { sell: t >= T.deploy.run[1] + 0.3 && !crashing, crash: crashing, seed: 0.4 });
  // rollback (line 16): boat C brings shop:1.2 from the shelf; 1.3 goes away
  boatAt(boatC, [[0, S2], [T.roll.sail[0], S2], [T.roll.sail[1], PIER2]], t, 0);
  carry(cargo12, t, { from: (i) => SLOT[1].clone().add(V(0, i, 0)), boat: boatC, to: (i) => SERVERSTACK.clone().add(V(0, i, 0)),
                      load: T.roll.load, land: T.roll.land });
  server12.forEach((s) => { s.g.visible = t >= T.roll.land[1]; });

  // people
  moveAlong(steve, STEVE, t);
  steve.arms[1].rotation.set(0, 0, 0);
  for (const a of [T.push.swing, T.del1[0] - 0.05, T.del2[0] - 0.05]) swingArm(steve, prog(t, a - 0.15, a + 0.15));
  moveAlong(alex, ALEX, t);
  moveAlong(customer, CUSTOMER, t);
  moveAlong(outsider, OUTSIDER, t);
  shakeNo(outsider, t, during(t, T.outsider[1], ev(12, 0.75)));
  if (!during(t, T.outsider[1], ev(12, 0.75))) outsider.head.rotation.x = 0;
  cover.position.y = coverY(t);
}

  B.merged.show(t, ev(14, 0.02), T.tests[0], BUILD.clone().add(V(0, 5.6, 0)));
  B.tests.show(t, T.tests[0] + 0.15, T.shelve[0], BUILD.clone().add(V(2.2, 4.2, 0)));
  B.pushed.show(t, T.shelve[1], end(14), SLOT[2].clone().add(V(0, 5.6, 0)));
  B.deploy.show(t, ev(15, 0.02), T.deploy.land[0], boatB.position.clone().add(V(0, 3.0, 0)));
  B.tested.show(t, T.deploy.run[1] + 0.1, end(15), V(-33.5, FLS + 4.2, 1.5));
  B.broke.show(t, T.crash + 0.05, ev(16, 0.36), V(-33.5, FLS + 4.2, 1.5));
  B.rollback.show(t, ev(16, 0.36), T.roll.land[1], V(-33.5, FLS + 4.2, 1.5));
  B.stillThere.show(t, T.roll.fixed, end(16), V(-33.5, FLS + 4.2, 1.5));
  [B.r1, B.r2, B.r3, B.r4].forEach((b, i) => b.show(t, ev(17, 0.02 + i * 0.2), COVER_IN, V(5.5, FL + 7.2 - 1.1 * i, 3)));
}

// ---------- camera ----------
const look = (p, q) => pose(p, q);
const COVER = look(V(4, 3.6, 30), V(4, 2.1, COVER_Z));
const STACKV = look(V(6.5, 4.8, 19.5), V(3.0, 2.4, 11.5));   // Steve's image, from the front
const OPEN = look(V(17, 15, 28), V(-18, -4, 6));            // the beach stacks, Alex, the harbor and the island
const HARBORV = look(V(-21.5, 8, 38), V(-21.5, -2.8, 22.5));     // the harbor from the sea
const PUSHV = look(V(-5, 9, 31), V(-15, -3, 18));            // the boat from the beach to the harbor
const ALEXV = look(V(11.8, 5, 29.5), V(11.8, 1.8, 17));    // Alex's stacks
const ROOMV = look(V(8, 7.5, 13.5), V(6, 2.3, 3.5));        // the shop's room and the barrel
const ROOMS3 = look(V(6, 14, 17), V(6, 1.5, 1));            // the three rooms
const BOOKV = look(V(0.0, 3.2, 13.6), V(0.5, 1.7, 10.2));   // the Compose book
const NETV = look(V(15, 9, 17), V(5, 1.5, 5.5));             // rails, stations, fence and gate
const ISLAND = look(V(-26, 3.5, 11), V(-34.5, -2.4, 1.5));  // the server
const PIPEV = look(V(-21.5, 3.5, 39), V(-21.5, -3.2, 25));    // the pipeline on the harbor
const SAILV = look(V(-7, 10, 19), V(-27, -4, 9));          // harbor to island
const LAND = look(V(-22, 3, 13), V(-32.5, -2.5, 2.5));      // the island
const ROLLV = look(V(-5, 18, 30), V(-26, -4, 10));           // harbor and island
const RECAP = look(V(9, 13, 19), V(6, 3.0, 1));
const CAM = [
  [0, COVER],
  [ev(0, 0.1), STACKV, 1.0],
  [ev(0, 0.36), ALEXV, 0.9],
  [ev(0, 0.64), OPEN, 1.0],
  [ev(1, 0.0), HARBORV, 1.3],
  [ev(2, 0.0), PUSHV, 1.2],
  [ev(2, 0.6), HARBORV, 1.0],
  [ev(3, 0.0), PUSHV, 1.0],
  [ev(3, 0.4), ALEXV, 1.0],
  [ev(4, 0.0), ROOMV, 1.3],
  [ev(8, 0.0), ROOMS3, 1.2],
  [ev(9, 0.45), BOOKV, 1.0],
  [ev(10, 0.0), ROOMS3, 1.0],
  [ev(11, 0.0), NETV, 1.2],
  [ev(13, 0.0), ISLAND, 1.4],
  [ev(14, 0.0), PIPEV, 1.3],
  [ev(15, 0.0), SAILV, 1.2],
  [ev(15, 0.45), LAND, 1.2],
  [ev(16, 0.25), ROLLV, 1.0],
  [ev(16, 0.68), LAND, 0.9],
  [ev(17, 0.0), RECAP, 1.4],
  [COVER_IN - 0.5, COVER, 1.8],
];
const camAt = smoothCamera(CAM, TOTAL, { sigma: 0.5 });

// ---------- sounds (game sounds, at the moment they happen) ----------
const sells = (a, z, seed = 0) => { const out = []; for (let s = Math.ceil((a + seed) / 1.6) * 1.6 - seed; s < z; s += 1.6) out.push([s, `villager_yes${(out.length % 3) + 1}`, 0.14]); return out; };
const glassBreak = (a) => [[a, 'glass1', 0.3], [a + 0.05, 'glass2', 0.25], [a + 0.1, 'glass3', 0.22]];
const glassUp = (a, z) => [0, 1, 2, 3].map((i) => [a + (z - a) * i / 4, `stone_dig${i + 1}`, 0.18]);
const sail = ([a, z]) => [0, 1, 2, 3].map((i) => [a + i * (z - a) / 4, `paddle${(i % 4) + 1}`, 0.26]);
window.sfxCues = [
  ...sells(0.3, ev(4, 0.5), 0.3),
  [T.push.swing, 'click', 0.2], [T.push.load[1], 'pop', 0.25], ...sail(T.push.sail), [T.push.land[1], 'shulker_close', 0.3],
  ...sail(T.pull.sail), [T.pull.land[1], 'pop', 0.25], [T.pull.ghost, 'lead_tie', 0.3], [T.pull.ghost + 0.2, 'orb', 0.2],
  ...T.orders.map((a) => [a, 'book_put', 0.2]),
  ...glassBreak(T.del1[0]), [T.del1[1] + 0.1, 'villager_no1', 0.22],
  ...glassUp(...T.reb1),
  [T.barrel, 'wood_dig1', 0.3], [T.hopper, 'stone_dig2', 0.28], ...T.feed.map((a) => [a + 0.5, 'barrel_close', 0.16]),
  ...glassBreak(T.del2[0]), ...glassUp(...T.reb2), [T.plug, 'click', 0.25], [T.open, 'barrel_open', 0.3], [T.open + 0.3, 'orb', 0.2],
  [T.book, 'book_flip1', 0.3],
  ...glassUp(...T.up), [T.up[1] + 0.1, 'levelup', 0.22],
  ...[0, 1, 2, 3].map((i) => [T.rails[0] + i * (T.rails[1] - T.rails[0]) / 4, `stone_step${i + 1}`, 0.2]),
  ...[0, 1, 2].map((i) => [T.fence[0] + i * (T.fence[1] - T.fence[0]) / 3, `wood_dig${i + 1}`, 0.2]),
  [T.ride[0], 'minecart_roll', 0.25], [T.ride[1], 'bell', 0.2],
  [T.outsider[1], 'villager_no2', 0.25], [T.gate, 'door_open', 0.3], ...sells(T.customer[1], end(12), 0.3),
  [ev(13, 0.48), 'chest_locked', 0.25],
  ...T.pipe.map((a, i) => [a, `stone_dig${i + 1}`, 0.25]), [T.tests[0], 'golem_hit', 0.22], [T.tests[0] + 0.2, 'orb', 0.22],
  [T.shelve[1], 'shulker_close', 0.28],
  [T.deploy.load[1], 'pop', 0.22], ...sail(T.deploy.sail), [T.deploy.land[1], 'stone_dig4', 0.28], ...glassUp(...T.deploy.run),
  ...sells(T.deploy.run[1] + 0.3, T.crash, 0.4),
  [T.crash, 'fizz', 0.3], [T.crash + 0.15, 'villager_no3', 0.26], ...sail(T.roll.sail), [T.roll.land[1], 'stone_dig1', 0.28],
  [T.roll.fixed, 'levelup', 0.22], ...sells(T.roll.fixed + 0.2, end(16), 0.4),
  [COVER_IN, 'wood_dig2', 0.3],
].map(([s, n, g]) => [Math.round(s * 1000) / 1000, n, g]);

// The loop: in the last line everything goes back to the first frame's state behind the cover
const LOOP_T = ev(18, 0.05);
window.renderAt = (t) => {
  scenePieces(t >= LOOP_T ? 0 : t);
  items(t >= LOOP_T ? 0 : t);
  cover.position.y = coverY(t);
  const cam = camAt(t);
  world.look(cam.pos, cam.look);
  camera.updateMatrixWorld();
  bubbles(t >= LOOP_T ? 0 : t);
  placeUI(camera);
  life.update(t);
  clouds.position.x = 4 * Math.sin(2 * Math.PI * t / TOTAL);
  world.draw(t, TOTAL, 0, 0);
};
window.sceneDuration = TOTAL;
</script>
