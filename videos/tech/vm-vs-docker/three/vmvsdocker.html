<body>
<script type="module">
// "VM vs Docker", on a sandy shore of MacEntorno (vs-shore, turn 0: scene = export coordinates). One stone platform
// split in two by a red wool line: in front, the VM side (houses with their own foundations and a villager inside, the
// Illusioner between them); behind, the Docker side (small glass rooms on one smooth-stone floor = the shared kernel).
// The high camera shows the VM side at the bottom of the frame and the Docker side at the top. On the strip to the
// right: the image sizes (a pile of chests vs one shulker box) and the two "when to use" books.
import { THREE, V, prog, easeInOut, pose } from '/vendor/lib/stage.js';
import { loadTheme, makeWorld, makeTerrain, makeClouds, makeSign, makeChest, tex } from '/vendor/tema/mc.js';
import { setTime, loadMobs, makeLife } from '/vendor/tema/vida.js';
import { loadPeople, makePlayer, makeVillager, makeIllager, moveAlong, entityPart } from '/vendor/tema/gente.js';
import { bubble, placeUI, smoothCamera, arc, makeItem, makeLectern, put } from '/vendor/tema/aldea.js';
import { shakeNo } from '/vendor/tema/objetos.js';

// ---------- timing ----------
const subs = (await (await fetch('/timestamps.json')).json()).subtitles;
const TOTAL = subs[subs.length - 1].end_s;
const ev = (line, f = 0) => subs[line].start_s + f * subs[line].duration_s;
const end = (line) => subs[line].end_s;
const during = (t, a, z) => t >= a && t < z;

// ---------- world ----------
const PLACE = '/vendor/tema/mundos/vs-shore.json';
const imgs = await loadTheme(['grass_side', 'grass_top', 'dirt', 'leaves', 'log_side', 'log_top', 'glass', 'stone',
  'stone_bricks', 'smooth_stone', 'oak_planks', 'cobble', 'quartz_block_side', 'quartz_block_top', 'red_wool',
  'lectern_front', 'lectern_top', 'shulker_lime', 'emerald', 'barrier', 'trade_glint', 'bell',
  ...Array.from({ length: 10 }, (_, i) => `destroy_stage_${i}`)]);
await loadPeople(imgs, ['steve', 'villager', 'type_plains', 'prof_cleric', 'prof_librarian', 'prof_mason', 'prof_nitwit',
  'illusioner', 'vindicator']);
await loadMobs(imgs, ['cow', 'chicken', 'squid']);
const world = makeWorld({ fov: 40, offset: 0, fog: [90, 220], shaders: true });
const { scene, camera } = world;

const PLAT = [-1, 17, -26, 6];
const PY = 3, HY = 4;   // platform top; house floors (on their own foundation)
const DIV = -8;         // the red line between the two sides
const inBox = ([x0, x1, z0, z1], x, z) => x >= x0 && x <= x1 && z >= z0 && z <= z1;
const data = await (await fetch(PLACE)).json();
data.blocks = data.blocks.filter(([x, y, z]) => !(inBox(PLAT, x, z) && y >= -1));
const terrain = await makeTerrain(PLACE, { data, clear: [-6, 24, -30, 16] });
scene.add(terrain);
const clouds = makeClouds(imgs);
scene.add(clouds);
const light = await setTime(world, 'day', { terrain, clouds, imgs });
world.sun.target.position.set(7, 0, -8);

const build = new THREE.Group();
scene.add(build);
const kernelFloor = new THREE.Group();   // the Docker side's floor: the shared kernel
scene.add(kernelFloor);
for (let x = PLAT[0]; x <= PLAT[1]; x++) for (let z = PLAT[2]; z <= PLAT[3]; z++) {
  for (let y = -1; y <= 1; y++) put(imgs, build, 'stone', x, y, z);
  const docker = z < DIV && x <= 11;
  put(imgs, docker ? kernelFloor : build, z === DIV ? 'red_wool' : docker ? 'smooth_stone' : 'stone_bricks', x, 2, z);
}

// ---------- helpers ----------
function glow(g, k) {
  g.traverse((o) => {
    if (!o.material) return;
    for (const m of Array.isArray(o.material) ? o.material : [o.material]) {
      if (!m.color) continue;
      if (!m.userData.base0) m.userData.base0 = m.color.clone();
      m.color.copy(m.userData.base0).multiplyScalar(1 + k);
    }
  });
}
const pulse = (t, a, z, period = 1.2) => (during(t, a, z) ? 0.6 * (0.5 - 0.5 * Math.cos((t - a) * 2 * Math.PI / period)) : 0);
const pop = (t, a, d = 0.2) => Math.max(1e-3, easeInOut(Math.min(1, Math.max(0, (t - a) / d))));
const shade = (color, op) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthWrite: false }));
  m.renderOrder = 5;
  scene.add(m);
  m.set = (k) => { m.material.opacity = op * k; m.visible = k > 0.01; };
  m.set(0);
  return m;
};

// ---------- the VM side: houses (5 x 5, own foundation, villager inside) ----------
const STYLES = {
  linux: { wall: 'oak_planks', corner: 'log', roof: 'oak_planks', prof: 'librarian' },
  windows: { wall: 'quartz', corner: 'quartz', roof: 'quartz', prof: 'cleric' },
  old: { wall: 'cobble', corner: 'stone_bricks', roof: 'stone', prof: 'mason' },
};
function makeHouse(x0, z0, style) {
  const S = STYLES[style];
  const g = new THREE.Group();
  const blocks = [], front = [], roof = [];
  for (let x = x0; x <= x0 + 4; x++) for (let z = z0; z <= z0 + 4; z++) blocks.push(put(imgs, g, 'stone', x, HY - 1, z));
  for (let y = HY; y <= HY + 2; y++) for (let x = x0; x <= x0 + 4; x++) for (let z = z0; z <= z0 + 4; z++) {
    const edgeX = x === x0 || x === x0 + 4, edgeZ = z === z0 || z === z0 + 4;
    if (!edgeX && !edgeZ) continue;
    const isFront = z === z0 + 4;
    if (isFront && x === x0 + 2 && y < HY + 2) continue;
    const b = put(imgs, g, edgeX && edgeZ ? S.corner : isFront && y < HY + 2 ? 'glass' : S.wall, x, y, z);
    blocks.push(b);
    if (isFront && !edgeX) front.push(b);
  }
  for (let x = x0; x <= x0 + 4; x++) for (let z = z0; z <= z0 + 4; z++) { const b = put(imgs, g, S.roof, x, HY + 3, z); blocks.push(b); roof.push(b); }
  const guest = makeVillager(imgs, { profession: S.prof, type: 'plains' });
  guest.g.position.set(x0 + 2, HY, z0 + 2.4);
  g.add(guest.g);
  scene.add(g);
  const h = { g, blocks, front, roof, guest, center: V(x0 + 2, HY, z0 + 2) };
  h.build = (k) => { blocks.forEach((b, i) => { b.visible = k * blocks.length > i; }); guest.g.visible = k >= 1; g.visible = k > 0; };
  return h;
}
const H = [makeHouse(0, 1, 'linux'), makeHouse(7, 1, 'linux'), makeHouse(0, -6, 'old'), makeHouse(7, -6, 'windows')];
const illusioner = makeIllager(imgs, { kind: 'illusioner' });
illusioner.g.position.set(5.5, PY, -0.5);
scene.add(illusioner.g);
const hit = shade(0x000010, 0.6);   // the house the vindicator breaks into goes dark (line 7)
hit.scale.set(5.2, 4.4, 5.2);
hit.position.set(9, HY + 1.3, 3);

// ---------- the Docker side: 3 x 3 glass rooms on the shared floor, 4 columns x 5 rows ----------
function makeRoom(x0, z0, quartz = false) {
  const g = new THREE.Group();
  const panes = [];
  for (let y = 0; y < 2; y++) for (let x = x0; x <= x0 + 2; x++) for (let z = z0 - 2; z <= z0; z++) {
    if (x === x0 + 1 && z === z0 - 1) continue;
    panes.push(put(imgs, g, quartz && y === 0 ? 'quartz' : 'glass', x, PY + y, z));
  }
  const v = makeVillager(imgs, { profession: 'nitwit', type: 'plains' });
  v.g.position.set(x0 + 1, PY, z0 - 1);
  v.g.scale.setScalar(0.85);
  g.add(v.g);
  scene.add(g);
  return { g, v, center: V(x0 + 1, PY, z0 - 1) };
}
const ROOMS = [];
for (let r = 0; r < 5; r++) for (let c = 0; c < 4; c++) ROOMS.push(makeRoom(3 * c, -10 - 3 * r));
const risk = shade(0xFF2020, 0.32);   // every container at risk (line 8)
risk.scale.set(12.4, 2.4, 15.4);
risk.position.set(5.5, PY + 1.2, -17.5);
// Cracks spreading across the shared floor (line 8): the game's destroy stages, tiled over the floor
const crackMaps = Array.from({ length: 10 }, (_, i) => { const m = tex(imgs, `destroy_stage_${i}`).clone(); m.wrapS = m.wrapT = THREE.RepeatWrapping; m.repeat.set(12, 15); m.needsUpdate = true; return m; });
const crackMat = new THREE.MeshBasicMaterial({ map: crackMaps[0], transparent: true, alphaTest: 0.1, depthWrite: false, toneMapped: false,
  blending: THREE.CustomBlending, blendSrc: THREE.DstColorFactor, blendDst: THREE.SrcColorFactor });
const cracks = new THREE.Mesh(new THREE.PlaneGeometry(12, 15), crackMat);
cracks.rotation.x = -Math.PI / 2;
cracks.position.set(5.5, PY + 0.01, -17.5);
cracks.renderOrder = 4;
scene.add(cracks);
// A Windows room that cannot exist (line 10): a quartz room appears ghostly and a barrier stops it
const qRoom = makeRoom(13.5 - 0.5, -10);
qRoom.g.traverse((o) => { if (o.material && !o.isSprite) { o.material = (Array.isArray(o.material) ? o.material : [o.material]).map((m) => { const c = m.clone(); c.transparent = true; c.opacity = 0.35; c.depthWrite = false; return c; }); } });
const barrier = makeItem(imgs, 'barrier', 0.9);
scene.add(barrier);

// ---------- the strip on the right: image sizes and the two books ----------
const PILE = V(15, PY, 2), SHULK = V(15, PY, -2.2);
const pile = [];
for (let y = 0; y < 3; y++) for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) {
  const c = makeChest(imgs, 0.9);
  c.g.position.set(PILE.x - 0.5 + a, PY + y, PILE.z - 0.5 + b);
  scene.add(c.g);
  pile.push(c.g);
}
const shulkerMat = new THREE.MeshBasicMaterial({ map: (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 64; c.getContext('2d').drawImage(imgs.shulker_lime, 0, 0); const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace; return t; })(), transparent: true, alphaTest: 0.1 });
const shulker = new THREE.Group();
shulker.add(entityPart(shulkerMat, [0, 24, 0], [[0, 28, -8, -8, -8, 16, 8, 16]]), entityPart(shulkerMat, [0, 24, 0], [[0, 0, -8, -16, -8, 16, 12, 16]]));
shulker.position.copy(SHULK);
scene.add(shulker);
const shulkerCopies = Array.from({ length: 4 }, () => { const s = shulker.clone(); s.scale.setScalar(0.35); s.visible = false; scene.add(s); return s; });
const bookVM = makeLectern(imgs), bookDock = makeLectern(imgs);
bookVM.g.position.set(15, PY, -6);
bookDock.g.position.set(15, PY, -20);
scene.add(bookVM.g, bookDock.g);
bookVM.setBook(['use a VM for', { s: 'another OS', color: 0x1E7A1E }, { s: 'strongest walls', color: 0x1E7A1E }, { s: 'a whole machine', color: 0x1E7A1E }]);
bookDock.setBook(['use containers for', { s: 'your services', color: 0x1E7A1E }, { s: 'many of them', color: 0x1E7A1E }, { s: 'shipped often', color: 0x1E7A1E }]);

// Containers inside a VM (line 16): small glass rooms inside house 0 when its front and roof come off
function makeMini(x, z) {
  const g = new THREE.Group();
  for (let y = 0; y < 2; y++) for (let a = 0; a <= 3; a++) for (let b = 0; b <= 3; b++) {
    if (a > 0 && a < 3 && b > 0 && b < 3) continue;
    put(imgs, g, 'glass', a, y, b);
  }
  const v = makeVillager(imgs, { profession: 'nitwit', type: 'plains' });
  v.g.position.set(1.5, 0, 1.5);
  g.add(v.g);
  g.position.set(x, HY, z);
  g.scale.setScalar(0.32);
  scene.add(g);
  return g;
}
const MINIS = [makeMini(0.7, 1.8), makeMini(2.1, 3.0)];

// ---------- people ----------
const vind = makeIllager(imgs, { kind: 'vindicator' });
scene.add(vind.g);
const VAT = (x, z) => V(x, Math.max(PY, terrain.groundAt(x, z)), z);
const bell = makeItem(imgs, 'bell', 0.6);
scene.add(bell);

// Background life
const loop = (cx, cz, w, h) => [[cx - w, cz - h], [cx + w, cz - h], [cx + w, cz + h], [cx - w, cz + h]];
const life = makeLife(imgs, terrain, [
  { kind: 'chicken', path: loop(20, 2, 1.5, 1.5), offset: 0.3 },
  { kind: 'cow', path: loop(-4, -20, 1.5, 2), offset: 0.7 },
], TOTAL, light);
scene.add(life.g);

// ---------- cover ----------
const COVER_Z = 9.5;
const cover = makeSign(imgs, ['VM', 'VS', 'DOCKER'], { w: 3.4, h: 2.2 });
const coverBase = Math.max(terrain.groundAt(8, COVER_Z), 0) + 2.2;
cover.position.set(8, coverBase, COVER_Z);
scene.add(cover);
const COVER_OUT = ev(0, 0.12), COVER_IN = ev(17, 0.8);
const coverY = (t) => coverBase - 5 * easeInOut(prog(t, COVER_OUT, COVER_OUT + 0.8)) * (1 - easeInOut(prog(t, COVER_IN, COVER_IN + 0.8)));

// ---------- events ----------
const T = {
  race: ev(5, 0.25),
  count: ev(6, 0.25),
  vindVM: [ev(7, 0.25), ev(7, 0.55)],
  vindKernel: [ev(8, 0.1), ev(8, 0.35)], crack: [ev(8, 0.35), ev(8, 0.75)],
  windows: ev(10, 0.12), noKernel: ev(10, 0.55),
  deploy: [ev(12, 0.35), ev(12, 0.7)],
  scale: ev(13, 0.2), reboot: [ev(13, 0.2), ev(14, 0.5)],
  books: [ev(14, 0.05), ev(15, 0.05)],
  inside: ev(16, 0.25),
};
// Houses: 0 and 1 from the start; 2 (old system) boots slowly in the race; 3 (Windows) appears in line 10;
// 1 goes dark when broken into (line 7) and reboots slowly while the containers scale (line 13)
const houseK = (i, t) => {
  if (i === 2) return prog(t, T.race, T.race + 7.5);
  if (i === 3) return prog(t, T.windows, T.windows + 1.2);
  if (i === 1 && t >= T.reboot[0] && t < ev(17, 0)) return prog(t, ...T.reboot);
  return 1;
};
// Rooms: 2 at the start, +6 in the race (one second), +4 in line 6, +8 in line 13
const roomAt = (i) => (i < 2 ? 0 : i < 8 ? T.race + 0.12 * (i - 2) : i < 12 ? T.count + 0.1 * (i - 8) : T.scale + 0.08 * (i - 12));
const VIND = [
  [0, VAT(9, 11), Math.PI], [T.vindVM[0], VAT(9, 11), Math.PI], [T.vindVM[1], V(9, PY, 6.4), Math.PI],
  [ev(7, 0.85), V(9, PY, 6.4), Math.PI], [ev(8, 0.02), V(12.6, PY, 6.2), Math.PI], [ev(8, 0.22), V(12.6, PY, -9.2), Math.PI],
  [T.vindKernel[1], V(11.7, PY, -9.2), -Math.PI / 2],
  [ev(9, 0.4), V(11.7, PY, -9), -Math.PI / 2], [ev(9, 0.9), VAT(18, -4), 0],
];

// ---------- per frame ----------
function scenePieces(t) {
  H.forEach((h, i) => { h.build(houseK(i, t)); h.guest.head.rotation.x = 0.2 * Math.max(0, Math.sin((t + i) * 3)); });
  hit.set(prog(t, T.vindVM[1], T.vindVM[1] + 0.3) * (1 - prog(t, T.reboot[0] - 0.3, T.reboot[0])));
  const open = during(t, T.inside, ev(17, 0.9));
  if (open) for (const b of [...H[0].front, ...H[0].roof]) b.visible = false;
  H[0].guest.g.visible = H[0].guest.g.visible && !open;
  MINIS.forEach((m, i) => { m.visible = open; m.scale.setScalar(0.32 * pop(t, T.inside + 0.15 * i)); });
  illusioner.crossed.rotation.x = during(t, ev(2, 0.1), ev(2, 0.9)) ? -2.2 : -0.75;

  ROOMS.forEach((R, i) => {
    const a = roomAt(i);
    R.g.visible = t >= a;
    R.g.scale.setScalar(1);
    R.v.head.rotation.x = 0.2 * Math.max(0, Math.sin((t + i * 0.37) * 3));
  });
  glow(kernelFloor, pulse(t, ev(3, 0.3), end(3), 1.0) + pulse(t, ev(17, 0.3), ev(17, 0.7), 1.0));
  const ck = prog(t, ...T.crack);
  cracks.visible = ck > 0 && t < ev(9, 0.9);
  crackMat.map = crackMaps[Math.min(9, Math.floor(ck * 10))];
  risk.set(prog(t, T.crack[0] + 0.2, T.crack[1]) * (1 - prog(t, ev(9, 0.6), ev(9, 0.9))));

  qRoom.g.visible = during(t, T.windows + 0.6, end(10));
  barrier.visible = during(t, T.noKernel, end(10));
  barrier.position.set(14, PY + 1.3, -11);

  // images: the pile of chests and the shulker box glow in line 4; small shulker copies fly to rooms (line 12)
  pile.forEach((c) => glow(c, pulse(t, ev(4, 0.1), ev(4, 0.55), 1.0)));
  glow(shulker, pulse(t, ev(4, 0.55), end(4), 1.0));
  shulkerCopies.forEach((s, i) => {
    const a = T.deploy[0] + 0.1 * i, k = prog(t, a, a + 0.6);
    s.visible = k > 0 && k < 1;
    if (s.visible) s.position.copy(arc(SHULK.clone().add(V(0, 0.8, 0)), ROOMS[4 + i].center.clone().add(V(0, 1.6, 0)), easeInOut(k), 2));
  });
  bookVM.open(prog(t, T.books[0], T.books[0] + 0.3) * (1 - prog(t, ev(17, 0), ev(17, 0.2))));
  bookDock.open(prog(t, T.books[1], T.books[1] + 0.3) * (1 - prog(t, ev(17, 0), ev(17, 0.2))));

  // the race (line 5): the bell rings
  bell.visible = during(t, T.race - 0.6, T.race + 1.2);
  bell.position.set(13.5, PY + 3 + 0.1 * Math.sin(t * 9), -8);

  moveAlong(vind, VIND, t);
  vind.g.visible = during(t, T.vindVM[0] - 0.1, ev(9, 0.9));
  shakeNo(vind, t, false);
}

// ---------- bubbles ----------
const B = {
  vmSide: bubble(['virtual machines'], { color: 0xFFFF55 }),
  dockSide: bubble(['containers'], { color: 0xFFFF55 }),
  imitates: bubble(['imitates the hardware'], { color: 0xFFFF55 }),
  ownOS: bubble(['own OS + kernel'], { color: 0xFFFFFF }),
  process: bubble(['a process on the host'], { color: 0xFFFF55 }),
  kernel: bubble(['one shared kernel'], { color: 0xFFFFFF }),
  gb: bubble(['VM image: GBs'], { color: 0xFF5555 }),
  mb: bubble(['container image: MBs'], { color: 0x55FF55 }),
  booting: bubble(['VM: booting...'], { color: 0xFF5555 }),
  second: bubble(['containers: a second'], { color: 0x55FF55 }),
  fewVM: bubble(['a handful of VMs'], { color: 0xFFFFFF }),
  manyC: bubble(['many more containers'], { color: 0x55FF55 }),
  oneHit: bubble(['one machine hit,', 'the others: own kernels'], { color: 0x55FF55 }),
  allRisk: bubble(['kernel bug:', 'every container at risk'], { color: 0xFF5555 }),
  clouds: bubble(['clouds: one VM per customer'], { color: 0xFFFF55 }),
  windows: bubble(['Windows on a Linux host'], { color: 0x55FF55 }),
  noKernel: bubble(['no kernel of its own'], { color: 0xFF5555 }),
  old: bubble(['old software: a VM'], { color: 0xFFFF55 }),
  fast: bubble(['small images', 'deploys in seconds'], { color: 0x55FF55 }),
  more: bubble(['+8 running'], { color: 0x55FF55 }),
  still: bubble(['still booting'], { color: 0xFF5555 }),
  both: bubble(['containers inside VMs'], { color: 0xFFFF55 }),
  desktop: bubble(['Docker Desktop:', 'a small Linux VM'], { color: 0xFFFFFF }),
  r1: bubble(['VMs imitate the hardware'], { color: 0xFFFF55 }),
  r2: bubble(['containers share the kernel'], { color: 0xFFFF55 }),
  r3: bubble(['teams stack them'], { color: 0x55FF55 }),
};
for (const b of Object.values(B)) scene.add(b);

function bubbles(t) {
  const hc = (i, y = 5.4) => H[i].center.clone().add(V(0, y, 0));
  B.vmSide.show(t, ev(1, 0.1), end(1), V(5.5, HY + 5.6, 0));
  B.dockSide.show(t, ev(1, 0.35), end(1), V(5.5, PY + 4.0, -17));
  B.imitates.show(t, ev(2, 0.05), ev(2, 0.5), V(5.5, PY + 3.2, -0.5));
  B.ownOS.show(t, ev(2, 0.5), end(2), hc(0));
  B.process.show(t, ev(3, 0.05), ev(3, 0.5), V(5.5, PY + 3.6, -14));
  B.kernel.show(t, ev(3, 0.5), end(3), V(5.5, PY + 2.4, -21));
  B.gb.show(t, ev(4, 0.12), end(4), PILE.clone().add(V(0, 4.2, 0)));
  B.mb.show(t, ev(4, 0.55), end(4), SHULK.clone().add(V(0, 2.4, 0)));
  B.booting.show(t, T.race + 0.2, end(5), V(2, HY + 6.5, -4));
  B.second.show(t, T.race + 1.0, end(5), V(8, PY + 4.5, -22));
  B.fewVM.show(t, T.count, end(6), V(5.5, HY + 5.4, 0));
  B.manyC.show(t, T.count + 0.3, end(6), V(5.5, PY + 3.4, -16));
  B.oneHit.show(t, T.vindVM[1] + 0.3, end(7), V(5.5, HY + 6.0, 0));
  B.allRisk.show(t, T.crack[0] + 0.4, end(8), V(5.5, PY + 3.6, -16));
  B.clouds.show(t, ev(9, 0.1), end(9), V(5.5, HY + 5.6, 0));
  B.windows.show(t, T.windows + 0.6, ev(10, 0.55), hc(3, 4.6));
  B.noKernel.show(t, T.noKernel + 0.05, end(10), V(14, PY + 3.0, -11));
  B.old.show(t, ev(11, 0.1), end(11), hc(2, 4.6));
  B.fast.show(t, ev(12, 0.3), end(12), V(5.5, PY + 3.6, -14));
  B.more.show(t, T.scale + 0.6, end(13), V(5.5, PY + 3.4, -20));
  B.still.show(t, T.scale + 0.6, end(13), hc(1, 4.6));
  B.both.show(t, T.inside + 0.3, ev(16, 0.6), hc(0, 3.4));
  B.desktop.show(t, ev(16, 0.6), end(16), hc(0, 3.4));
  [B.r1, B.r2, B.r3].forEach((b, i) => b.show(t, ev(17, 0.02 + 0.25 * i), COVER_IN, V(5.5, 14 - 3.0 * i, -6)));
}

// ---------- camera ----------
const look = (p, q) => pose(p, q);
const COVER = look(V(8, coverBase + 1.4, 18.5), V(8, coverBase - 0.2, COVER_Z));
const SPLIT = look(V(5.5, 24, 22), V(5.5, 2, -9));           // both sides: VM at the bottom, Docker at the top
const VMV = look(V(5.5, 14, 18), V(5.5, 4, -1));          // the VM side
const DOCKV = look(V(5.5, 17, 0), V(5.5, 2.5, -17));        // the Docker side, over the houses
const RIGHTV = look(V(21, 7, 9), V(15, 3.8, -0.5));            // the right strip: pile, shulker, books
const HIT = look(V(18, 11, 16), V(9, 4, 3));                  // the vindicator at house 1
const CRACKV = look(V(17, 11, -4), V(6, 2.5, -15));          // the cracked floor
const WINV = look(V(23, 17, 9), V(10.5, 4, -6.5));              // the Windows house and the barrier
const INSIDE = look(V(2.5, 6.5, 11), V(2, 4, 3));            // house 0 opened
const BOOKVMV = look(V(15.4, 5.6, -2.6), V(15, 3.7, -6));     // the VM book
const BOOKDV = look(V(15.4, 5.6, -16.6), V(15, 3.7, -20));    // the containers book
const CAM = [
  [0, COVER],
  [ev(0, 0.1), SPLIT, 1.4],
  [ev(2, 0.0), VMV, 1.2],
  [ev(3, 0.0), DOCKV, 1.2],
  [ev(4, 0.0), RIGHTV, 1.2],
  [ev(5, 0.0), SPLIT, 1.2],
  [ev(7, 0.0), HIT, 1.2],
  [ev(8, 0.0), CRACKV, 1.2],
  [ev(9, 0.0), SPLIT, 1.2],
  [ev(10, 0.0), WINV, 1.2],
  [ev(11, 0.0), VMV, 1.0],
  [ev(12, 0.0), DOCKV, 1.1],
  [ev(13, 0.0), SPLIT, 1.1],
  [ev(14, 0.0), BOOKVMV, 1.2],
  [ev(15, 0.0), BOOKDV, 1.0],
  [ev(16, 0.0), INSIDE, 1.2],
  [ev(17, 0.0), SPLIT, 1.3],
  [COVER_IN - 0.5, COVER, 1.8],
];
const camAt = smoothCamera(CAM, TOTAL, { sigma: 0.5 });

// ---------- sounds ----------
window.sfxCues = [
  [ev(2, 0.1), 'illusioner_mirror', 0.25], [ev(3, 0.3), 'orb', 0.2],
  [ev(4, 0.12), 'chestclosed', 0.22], [ev(4, 0.55), 'shulker_close', 0.25],
  [T.race - 0.5, 'bell', 0.3], ...Array.from({ length: 6 }, (_, i) => [T.race + 0.12 * i, `glass${(i % 3) + 1}`, 0.14]),
  ...Array.from({ length: 10 }, (_, i) => [T.race + i * 0.75, `stone_dig${(i % 4) + 1}`, 0.16]),
  ...Array.from({ length: 4 }, (_, i) => [T.count + 0.1 * i, `glass${(i % 3) + 1}`, 0.14]),
  [T.vindVM[1], 'break', 0.28], [T.vindVM[1] + 0.2, 'villager_no1', 0.22],
  [T.crack[0], 'stone_dig1', 0.28], [T.crack[0] + 0.15, 'stone_dig2', 0.28], [T.crack[0] + 0.3, 'stone_dig3', 0.28], [T.crack[1], 'break', 0.3],
  [T.windows, 'stone_dig4', 0.22], [T.noKernel, 'chest_locked', 0.25],
  ...Array.from({ length: 4 }, (_, i) => [T.deploy[0] + 0.1 * i + 0.6, 'pop', 0.16]),
  ...Array.from({ length: 8 }, (_, i) => [T.scale + 0.08 * i, `glass${(i % 3) + 1}`, 0.13]), [T.scale + 0.7, 'orb', 0.2],
  [T.books[0], 'book_flip1', 0.25], [T.books[1], 'book_flip2', 0.25],
  [T.inside, 'glass1', 0.2], [T.inside + 0.15, 'glass2', 0.2],
  [COVER_IN, 'wood_dig2', 0.3],
].map(([s, n, g]) => [Math.round(s * 1000) / 1000, n, g]);

const LOOP_T = ev(18, 0.05);
window.renderAt = (t) => {
  const s = t >= LOOP_T ? 0 : t;
  scenePieces(s);
  cover.position.y = coverY(t);
  const cam = camAt(t);
  world.look(cam.pos, cam.look);
  camera.updateMatrixWorld();
  bubbles(s);
  placeUI(camera);
  life.update(t);
  clouds.position.x = 4 * Math.sin(2 * Math.PI * t / TOTAL);
  world.draw(t, TOTAL, 0, 0);
};
window.sceneDuration = TOTAL;
</script>
