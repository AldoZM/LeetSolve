<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #A6C8F8; overflow: hidden; }</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import { THREE, prog, easeInOut, easeOut, easeOutBack, lerp, V, bezier, pose, mixPose } from '/vendor/lib/stage.js';
import { MC, loadTheme, makeWorld, makeTerrain, makeBlock, makeFrame, makeSign, pixelSprite, makeOrb, makeClouds } from '/vendor/tema/mc.js';
import { loadMobs, planLife, makeLife, setTime } from '/vendor/tema/vida.js';

const walk = await (await fetch('/walk.json')).json();
// One clip for the whole video: times are absolute. The walk happens in [W0, W1]; the rest is a slow roam that
// ends where it starts, so the video still loops.
const subs = (await (await fetch('/timestamps.json')).json()).subtitles;
const seg = (i) => subs[i].start_s;
const TOTAL = subs[subs.length - 1].end_s;
const W0 = seg(walk.first), W1 = subs[walk.last].end_s;
const at = (spec) => seg(spec[0]) + spec[1];
const imgs = await loadTheme(['grass_side', 'grass_top', 'dirt', 'planks', 'leaves', 'log_side', 'log_top',
                              ...new Set(walk.ores.map((o) => `${o}_ore`))]);

const N = walk.nums.length;
const ident = walk.nums.map((_, i) => i);
// The arrangements of the row: [time, piece size, slot order]; the walk opens on the whole uncut row
const arr = [[W0, N, ident], ...walk.arrangements.map(([t, k, o]) => [at(t), k, o])];
const marks = walk.marks.map(([a, b, s0, s1]) => ({ on: at(a), off: at(b), s0, s1 }));
const verdicts = walk.verdicts.map(([k, t, ok]) => ({ k, t: at(t), ok }));
const T = { chain: at(walk.chain), toast: at(walk.toast), sum: at(walk.sum_t) };
const GLIDE = 0.6;

const world = makeWorld({ fov: 40, offset: 0.34, fog: [55, 120] });
const { scene } = world;
// Rolling meadow east of spawn (see mundos/lugares.json); the plot reaches the camera so no dirt wall shows in front
const terrain = await makeTerrain('/vendor/tema/mundos/east-meadow.json', { turn: 3.927, plot: [-12, 12, -2, 20], clear: [-10, 10, 7, 24] });
scene.add(terrain);
const clouds = makeClouds(imgs);
scene.add(clouds);
// Night: the hostile mobs wander far behind; the pieces keep their full light
const LIFE = [{ kind: 'zombie', count: 2 }, { kind: 'skeleton', count: 2 }, { kind: 'creeper', count: 1, graze: 1 },
              { kind: 'spider', count: 1 }];
await loadMobs(imgs, LIFE.map((g) => g.kind));
const dark = await setTime(world, 'night', { terrain, clouds, imgs });
const life = makeLife(imgs, terrain, planLife(terrain, LIFE, { seed: 3886 }), TOTAL, dark);
scene.add(life.g);
const stage = new THREE.Group();
scene.add(stage);

const SP = 1.05, GAP = 0.32;
const G0 = terrain.groundAt(0, 0);
// x of slot s when the row is cut into pieces of size k (a gap between pieces)
const slotX = (s, k) => (s - (N - 1) / 2) * SP + (Math.floor(s / k) - (N / k - 1) / 2) * GAP;
const blocks = walk.nums.map((v, i) => { const b = makeBlock(imgs, `${walk.ores[i]}_ore`, { label: v }); stage.add(b.g); return b; });

function place(i, t) {
  // [x, lift] of original block i at time t, gliding between arrangements; a block that changes slot hops over the others
  let k = 0;
  while (k + 1 < arr.length && t >= arr[k + 1][0]) k++;
  const [t1, k1, o1] = arr[k];
  const x1 = slotX(o1.indexOf(i), k1);
  if (k === 0) return [x1, 0];
  const [, k0, o0] = arr[k - 1];
  const x0 = slotX(o0.indexOf(i), k0);
  const f = easeInOut(prog(t, t1, t1 + GLIDE));
  const moved = o0.indexOf(i) !== o1.indexOf(i);
  return [lerp(x0, x1, f), (moved ? 0.6 + 0.25 * Math.abs(x1 - x0) : 0) * Math.sin(Math.PI * f)];
}

// Drop marks: a red "v" between two blocks, or a red dotted arc for a wrap from the end of a piece to its start
const DOTS = 16;
const dotMat = new THREE.MeshBasicMaterial({ color: MC.red, toneMapped: false, transparent: true });
const markObjs = marks.map((m) => {
  if (m.s1 > m.s0) { const s = pixelSprite('v', MC.red, 0.55); stage.add(s); return { m, s }; }
  const dots = Array.from({ length: DOTS }, () => { const d = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.11, 0.11), dotMat); stage.add(d); return d; });
  return { m, dots };
});
// Verdicts over the row, and the running sum on a sign
const verdictSprites = verdicts.map((v) => { const s = pixelSprite(`k = ${v.k}  ${v.ok ? 'ok' : 'no'}`, v.ok ? MC.green : MC.red, 0.75); stage.add(s); return s; });
const sums = [['sum', '0'], ['sum', '2'], ['sum', '2 + 3'], ['sum', '2 + 3 = 5']]
  .map((l) => { const s = makeSign(imgs, l, { w: 2.8, h: 1.15, post: false }); stage.add(s); return s; });
const pieceFrames = walk.nums.map(() => { const f = makeFrame(1.06, 0.04, MC.gold); stage.add(f); return f; });

let seed = 3886;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const orbs = Array.from({ length: 22 }, (_, k) => {
  const o = makeOrb(imgs, 0.3, [1, 2, 4, 5, 6][k % 5]);
  o.userData = { vx: (rnd() - 0.5) * 2.4, vy: 2.6 + rnd() * 2.0, vz: (rnd() - 0.4) * 1.4, delay: rnd() * 0.35 };
  stage.add(o);
  return o;
});
stage.traverse((o) => { if (o.isSprite) o.renderOrder = 10; });

function renderAt(t) {
  const push = easeInOut(prog(t, T.toast - 0.3, T.toast + 0.8));
  const sway = 0.4 * Math.sin(t * 0.35);
  const walkPose = pose(V(sway, lerp(7.0, 6.7, push), lerp(16.2, 15.5, push)), V(sway * 0.4, 1.5, 0.0));
  const a = 2 * Math.PI * t / TOTAL;
  const roamPose = pose(V(6 * Math.sin(a), 3.4 + 0.8 * Math.sin(2 * a), 13 + 2.5 * Math.cos(a)), V(3 * Math.sin(a), 4.2, -30));
  const k = easeInOut(prog(t, W0 - 1.6, W0 - 0.1)) * (1 - easeInOut(prog(t, W1 + 0.1, W1 + 1.6)));
  const cam = mixPose(roamPose, walkPose, k);
  world.look(cam.pos, cam.look);
  world.camera.setViewOffset(world.W, world.H, 0, world.H * lerp(0.12, 0.34, k), world.W, world.H);
  clouds.position.x = 4 * Math.sin(a);
  life.update(t);
  stage.visible = t < W1;

  const win = prog(t, T.sum, T.sum + 0.4);
  const pos = blocks.map((b, i) => {
    const d = prog(t, W0 + 0.12 * i, W0 + 0.12 * i + 0.55);
    const fall = d < 1 ? (1 - d) * (1 - d) * 4.5 : 0;
    const [x, lift] = place(i, t);
    b.g.position.set(x, G0 + 0.5 + fall + lift, 0);
    b.g.visible = d > 0;
    b.set({ glow: 0.25 * win, opacity: d > 0 ? 1 : 0 });
    return b.g.position;
  });

  // Slot positions now (for the marks), from whichever block sits in each slot
  let cur = arr[0];
  for (const r of arr) if (t >= r[0]) cur = r;
  const slotPos = (s) => pos[cur[2][s]];
  markObjs.forEach(({ m, s, dots }) => {
    const v = prog(t, m.on, m.on + 0.25) * (1 - prog(t, m.off - 0.2, m.off));
    if (s) {
      s.visible = v > 0.01;
      s.material.opacity = v;
      const p0 = slotPos(m.s0), p1 = slotPos(m.s1);
      s.position.set((p0.x + p1.x) / 2, G0 + 1.35 + 0.08 * Math.sin(t * 6), 0);
    } else {
      const p0 = slotPos(m.s0), p1 = slotPos(m.s1);
      const mid = V((p0.x + p1.x) / 2, G0 + 1.4 + 0.25 * Math.abs(p0.x - p1.x), -0.5);
      dots.forEach((d, j) => {
        const u = j / (DOTS - 1);
        d.visible = v > 0.01 && u <= prog(t, m.on, m.on + 0.5);
        d.position.copy(bezier(V(p0.x, G0 + 1.05, 0), mid, V(p1.x, G0 + 1.05, 0), u));
      });
      dotMat.opacity = 0.9;
    }
  });

  // Chain check: every piece lights its frame in turn
  blocks.forEach((b, i) => {
    const slot = cur[2].indexOf(i), piece = Math.floor(slot / cur[1]);
    const f = Math.sin(Math.PI * prog(t, T.chain + 0.3 * piece, T.chain + 0.3 * piece + 0.5));
    pieceFrames[i].visible = f > 0.01 || win > 0.01;
    pieceFrames[i].position.copy(pos[i]);
    pieceFrames[i].userData.mat.opacity = Math.max(f, win);
  });

  // The verdict of a size stays until the next size starts
  verdicts.forEach((v, j) => {
    const next = j + 1 < verdicts.length ? arr.find((r) => r[0] > v.t)?.[0] ?? T.toast : T.toast;
    const a2 = easeOutBack(prog(t, v.t, v.t + 0.3)) * (1 - prog(t, next - 0.2, next));
    verdictSprites[j].visible = a2 > 0.01;
    verdictSprites[j].setSize(Math.max(a2, 1e-4));
    verdictSprites[j].position.set(0, G0 + 1.95, 0);
  });

  // The running sum: 0, then 2, then 2 + 3, then 2 + 3 = 5
  const sIn = easeOutBack(prog(t, W0 + 1.0, W0 + 1.5));
  let si = 0;
  if (t >= verdicts[1].t) si = 1;
  if (t >= verdicts[2].t) si = 2;
  if (t >= T.sum) si = 3;
  sums.forEach((s, j) => {
    s.visible = sIn > 0.001 && j === si;
    s.scale.setScalar(Math.max(sIn, 1e-4) * (j === 3 ? 1 + 0.12 * Math.sin(Math.PI * prog(t, T.sum, T.sum + 0.6)) : 1));
    s.position.set(0, G0 + 0.5, 3.3);
  });

  for (const o of orbs) {
    const { vx, vy, vz, delay } = o.userData;
    const u = t - (T.toast + delay);
    o.visible = u > 0 && u < 1.6;
    if (!o.visible) continue;
    const y = G0 + 1.4 + vy * u - 4.5 * u * u;
    o.position.set(vx * u, Math.max(y, G0 + 0.1), vz * u);
    o.tint(t + delay);
    o.material.opacity = 1 - prog(u, 1.2, 1.6);
  }

  world.draw(t, TOTAL, 0, 0);
}

window.renderAt = renderAt;
window.sceneDuration = TOTAL;
</script>
</body>
</html>
