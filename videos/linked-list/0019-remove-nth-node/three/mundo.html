<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #A6C8F8; overflow: hidden; }</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import { THREE, prog, easeInOut, easeOut, easeOutBack, lerp, V, bezier, pose, mixPose } from '/vendor/lib/stage.js';
import { MC, loadTheme, makeWorld, makeTerrain, makeBlock, makeFrame, pixelSprite, makeOrb, makeClouds, tex } from '/vendor/tema/mc.js';
import { loadMobs, planLife, makeLife, setTime } from '/vendor/tema/vida.js';

const walk = await (await fetch('/walk.json')).json();
// One clip for the whole video: times are absolute. The walk happens in [W0, W1]; the rest is a slow roam that
// ends where it starts, so the video still loops.
const subs = (await (await fetch('/timestamps.json')).json()).subtitles;
const seg = (i) => subs[i].start_s;
const TOTAL = subs[subs.length - 1].end_s;
const W0 = seg(walk.first), W1 = subs[walk.last].end_s;
const at = (spec) => seg(spec[0]) + spec[1];
const imgs = await loadTheme(['grass_side', 'grass_top', 'dirt', 'planks', 'leaves', 'log_side', 'log_top', 'barrier',
                              'stone', 'lapis_ore']);

const moves = walk.moves.map((m) => ({ ...m, T: at(m.t) }));
const T = { start: at(walk.start), sits: at(walk.sits), before: at(walk.before), skip: at(walk.skip),
            relink: at(walk.relink), toast: at(walk.toast), read: walk.read.map(at) };

const world = makeWorld({ fov: 40, offset: 0.34, fog: [55, 120] });
const { scene } = world;
// A path inside a closed oak forest (see mundos/lugares.json), turned so the camera looking toward -z sees the trees
const terrain = await makeTerrain('/vendor/tema/mundos/oak-path.json', { turn: 2.3562, plot: [-12, 12, -2, 20], clear: [-10, 10, 7, 24] });
scene.add(terrain);
const clouds = makeClouds(imgs);
scene.add(clouds);
// Night in the forest: hostile mobs wander behind the chain; the walk itself keeps full light so it reads well
const LIFE = [{ kind: 'zombie', count: 2 }, { kind: 'skeleton', count: 2 }, { kind: 'spider', count: 1 }, { kind: 'creeper', count: 1, graze: 1 }];
await loadMobs(imgs, LIFE.map((g) => g.kind));
const dark = await setTime(world, 'night', { terrain, clouds, imgs });
const life = makeLife(imgs, terrain, planLife(terrain, LIFE, { seed: 19 }), TOTAL, dark);
scene.add(life.g);
// Everything of the walk lives in its own group, hidden outside the walk
const stage = new THREE.Group();
scene.add(stage);

// Slots: 0 is the dummy, 1..5 the nodes, 6 the null at the end
const SZ = 0.8, SP = 1.2;
const NV = walk.vals.length, NULL = NV + 1;
const bx = (k) => (k - 3) * SP;
const g0 = terrain.groundAt(0, 0);
const YC = SZ / 2 + g0;
const blocks = [makeBlock(imgs, 'stone', { label: 'D', size: SZ }), ...walk.vals.map((v) => makeBlock(imgs, 'lapis_ore', { label: v, size: SZ }))];
blocks.forEach((b) => stage.add(b.g));

// next pointers: wooden rods between neighbors; a dark red rod to the barrier (null) after the last block
const rodMat = new THREE.MeshBasicMaterial({ map: tex(imgs, 'planks') });
rodMat.color.setScalar(0.85);
const nullMat = new THREE.MeshBasicMaterial({ color: 0x5a2020 });
const rodGeo = new THREE.BoxGeometry(1, 0.11, 0.11);
rodGeo.translate(0.5, 0, 0);
const GAP = SP - SZ;
const rods = Array.from({ length: NV }, (_, k) => {
  const r = new THREE.Mesh(rodGeo, rodMat);
  r.position.set(bx(k) + SZ / 2, YC, 0);
  stage.add(r);
  return r;
});
const nullRod = new THREE.Mesh(rodGeo, nullMat);
nullRod.position.set(bx(NV) + SZ / 2, YC, 0);
stage.add(nullRod);
const barrier = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex(imgs, 'barrier'), transparent: true, depthWrite: false }));
barrier.position.set(bx(NULL), YC, 0);
stage.add(barrier);

// The two pointers: an outline around their block and their name above it (slow lower, fast higher)
const slowF = makeFrame(SZ + 0.16, 0.05, MC.aqua), fastF = makeFrame(SZ + 0.06, 0.05, MC.gold);
const target = makeFrame(SZ + 0.1, 0.05, MC.red);
stage.add(slowF, fastF, target);
const slowL = pixelSprite('slow', MC.aqua, 0.36), fastL = pixelSprite('fast', MC.gold, 0.36);
stage.add(slowL, fastL);

// Bits of the broken block
let seed = 23;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const bits = Array.from({ length: 10 }, () => {
  const b = makeBlock(imgs, 'lapis_ore', { size: 0.16 });
  b.g.userData = { vx: (rnd() - 0.5) * 2.4, vy: 1.5 + rnd() * 1.8, vz: (rnd() - 0.2) * 1.6, spin: (rnd() - 0.5) * 10 };
  stage.add(b.g);
  return b;
});

// Experience orbs at the end
const orbs = Array.from({ length: 24 }, (_, n) => {
  const o = makeOrb(imgs, 0.32, [1, 2, 4, 5, 6][n % 5]);
  o.userData = { from: [1, 2, 3, 5][n % 4], vx: (rnd() - 0.5) * 1.6, vy: 2.0 + rnd() * 1.8, vz: (rnd() - 0.3) * 1.6, delay: rnd() * 0.35 };
  stage.add(o);
  return o;
});

// Terrain materials are transparent (alpha-tested) and sorted with the sprites; sprites go last so the ground can't paint over them
stage.traverse((o) => { if (o.isSprite) o.renderOrder = 10; });

// Where a pointer is at time t: it hops from slot to slot with a small arc
function pointerAt(who, t) {
  let x = bx(0), y = 0, slot = 0;
  for (const m of moves) {
    if (m.who !== who) continue;
    const f = easeInOut(prog(t, m.T - 0.05, m.T + 0.3));
    if (f <= 0) break;
    x = lerp(bx(slot), bx(m.to), f);
    y = 0.45 * Math.sin(Math.PI * f);
    if (f >= 1) slot = m.to;
  }
  return { x, y, slot };
}

function renderAt(t) {
  // Walk camera: front view of the chain with a slow drift; roam camera: one slow loop over the forest path
  const sway = 0.5 * Math.sin(t * 0.35);
  const walkPose = pose(V(sway * 0.3, 4.4, 16.6), V(sway * 0.1, 2.3, 0.0));
  const a = 2 * Math.PI * t / TOTAL;
  const roamPose = pose(V(6 * Math.sin(a), 3.4 + 0.8 * Math.sin(2 * a), 13 + 2.5 * Math.cos(a)), V(3 * Math.sin(a), 4.2, -30));
  const k = easeInOut(prog(t, W0 - 1.6, W0 - 0.1)) * (1 - easeInOut(prog(t, W1 + 0.1, W1 + 1.6)));
  const cam = mixPose(roamPose, walkPose, k);
  world.look(cam.pos, cam.look);
  // The walk keeps its content high in the frame (the overlay uses the bottom); the roam shows more sky
  world.camera.setViewOffset(world.W, world.H, 0, world.H * lerp(0.12, 0.34, k), world.W, world.H);
  clouds.position.x = 4 * Math.sin(a);
  life.update(t);
  stage.visible = t < W1;
  if (!stage.visible) { world.draw(t, TOTAL, 0, 0); return; }

  // The chain drops in block by block at the start of the walk, then its pointers grow
  const t0 = W0 + 0.1;
  const brk = prog(t, T.skip, T.skip + 0.35);
  blocks.forEach((b, i) => {
    const d = prog(t, t0 + 0.08 * i, t0 + 0.08 * i + 0.45);
    const fall = d < 1 ? (1 - d) * (1 - d) * 4 : 0;
    let glow = 0, sc = 1, x = bx(i);
    if (i === walk.removed) {
      // The target shakes when it is named, then breaks
      glow += 0.35 * Math.sin(Math.PI * prog(t, T.before, T.before + 0.7));
      x += 0.05 * Math.sin(t * 60) * prog(t, T.skip - 0.4, T.skip) * (brk < 1 ? 1 : 0);
      sc = 1 - brk;
    }
    if (i === walk.slow) glow += 0.4 * Math.sin(Math.PI * prog(t, T.sits, T.sits + 0.7));
    const r = walk.result.indexOf(walk.vals[i - 1]);
    if (i > 0 && r >= 0) glow += 0.45 * Math.sin(Math.PI * prog(t, T.read[r] - 0.1, T.read[r] + 0.45));
    b.g.position.set(x, YC + fall, 0);
    b.g.scale.setScalar(Math.max(sc, 1e-4));
    b.set({ glow, opacity: d > 0 && sc > 0.01 ? 1 : 0 });
  });
  const tr = t0 + 0.08 * blocks.length + 0.3;
  rods.forEach((r, k) => {
    const g = prog(t, tr + 0.06 * k, tr + 0.06 * k + 0.25);
    let len = g * GAP;
    if (k === walk.slow) len = lerp(len, 2 * SP - SZ, easeInOut(prog(t, T.relink - 0.1, T.relink + 0.5)));
    if (k === walk.removed) r.visible = g > 0 && brk < 1;
    else r.visible = g > 0;
    r.scale.x = Math.max(len, 1e-4);
  });
  const gn = prog(t, tr + 0.4, tr + 0.7);
  nullRod.visible = gn > 0;
  nullRod.scale.x = Math.max(gn * GAP, 1e-4);
  // The barrier pulses when fast falls onto it
  const last = moves[moves.length - 1];
  const hit = Math.sin(Math.PI * prog(t, last.T + 0.2, last.T + 0.8));
  barrier.visible = gn > 0;
  barrier.scale.setScalar(Math.max(0.6 * easeOutBack(gn) * (1 + 0.35 * hit), 1e-4));

  // Pointers, from the moment both start on the dummy
  const pIn = easeOutBack(prog(t, T.start, T.start + 0.4));
  const s = pointerAt('slow', t), f = pointerAt('fast', t);
  const sitP = 1 + 0.1 * Math.sin(Math.PI * prog(t, T.sits, T.sits + 0.7));
  slowF.visible = slowL.visible = fastF.visible = fastL.visible = pIn > 0.01;
  slowF.position.set(s.x, YC + s.y, 0);
  slowF.scale.setScalar(Math.max(pIn * sitP, 1e-4));
  slowL.position.set(s.x, YC + s.y + 0.8, 0);
  slowL.setSize(pIn);
  // On the barrier the fast outline shrinks to the sprite's size
  const onNull = prog(t, last.T + 0.1, last.T + 0.3);
  fastF.position.set(f.x, YC + f.y, 0);
  fastF.scale.setScalar(Math.max(pIn * lerp(1, 0.8, onNull), 1e-4));
  fastL.position.set(f.x, YC + f.y + 1.22, 0);
  fastL.setSize(pIn);

  // Red outline on the target, from "right before the four" until it breaks
  target.visible = t >= T.before && brk < 1;
  target.position.set(bx(walk.removed), YC, 0);
  target.scale.setScalar(Math.max(easeOutBack(prog(t, T.before, T.before + 0.35)), 1e-4));

  // Bits of the broken block
  for (const b of bits) {
    const { vx, vy, vz, spin } = b.g.userData;
    const u = t - T.skip;
    b.g.visible = u > 0 && u < 1.1;
    if (!b.g.visible) continue;
    b.g.position.set(bx(walk.removed) + vx * u, Math.max(YC + vy * u - 4.9 * u * u, g0 + 0.08), vz * u);
    b.g.rotation.set(spin * u, spin * u * 0.7, 0);
  }

  // Orbs from the finished list
  for (const o of orbs) {
    const { from, vx, vy, vz, delay } = o.userData;
    const u = t - (T.toast + delay);
    o.visible = u > 0 && u < 1.6;
    if (!o.visible) continue;
    o.position.set(bx(from) + vx * u, Math.max(YC + 0.5 + vy * u - 4.5 * u * u, g0 + 0.1), vz * u);
    o.tint(t + delay);
    o.material.opacity = 1 - prog(u, 1.2, 1.6);
  }

  world.draw(t, TOTAL, 0, 0);
}

window.renderAt = renderAt;
window.sceneDuration = TOTAL;
</script>
</body>
</html>
