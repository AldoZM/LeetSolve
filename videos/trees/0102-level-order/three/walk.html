<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #0B0E1A; overflow: hidden; }</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import { THREE, C, prog, easeInOut, easeOutBack, lerp, V, bezier, mixColor, loadTiming, textSprite,
         makeTile, makeOrb, makeRod, makeStage, pose, poseTrack } from '/vendor/lib/stage.js';

const walk = await (await fetch('/walk.json')).json();
const { seg, total: TOTAL } = await loadTiming(walk.first, walk.last);
const at = (spec) => seg(spec[0]) + spec[1];
const NODES = walk.nodes, LEVELS = walk.levels;
const events = walk.events.map((e) => ({ ...e, tt: at(e.t) }));
const tInit = at(walk.init), tFinal = at(walk.final);
const LC = [C.cyan, C.violet, C.magenta, C.green];

const XS = { 0: 0.0, 1: -2.0, 2: 2.0, 3: -3.0, 4: -1.0, 5: 1.0, 6: 3.0, 7: -0.5, 8: 0.5 };
const LY = [3.4, 1.9, 0.4, -1.1];
const depth = NODES.map((_, i) => LEVELS.findIndex((ids) => ids.includes(i)));
const nodePos = (i) => V(XS[i] * 1.15, LY[depth[i]], 0);

const st = makeStage({ gridY: -3.6, gridX: 0, offset: 0.2, bloom: 0.55 });
const { scene } = st;

// Level planes: glowing slabs that light up while their level is processed
const planes = LY.map((y, L) => {
  const mat = new THREE.MeshBasicMaterial({ color: LC[L], transparent: true, opacity: 0, toneMapped: false, depthWrite: false, side: THREE.DoubleSide });
  const m = new THREE.Mesh(new THREE.BoxGeometry(8.6, 0.04, 2.4), mat);
  m.position.set(0, y - 0.68, 0); scene.add(m);
  return { m, mat };
});
const levelSpan = LEVELS.map((_, L) => ({
  t0: events.find((e) => e.kind === 'size' && e.level === L).tt,
  t1: events.find((e) => e.kind === 'done' && e.level === L).tt,
}));

// Tree
const orbs = NODES.map((n, i) => { const o = makeOrb(n.val, LC[depth[i]], { r: 0.55 }); o.g.position.copy(nodePos(i)); scene.add(o.g); return o; });
const rods = NODES.map((n, i) => {
  if (n.parent === null) return null;
  const a = nodePos(n.parent), b = nodePos(i);
  const dir = b.clone().sub(a).normalize();
  const r = makeRod(a.clone().addScaledVector(dir, 0.55), b.clone().addScaledVector(dir, -0.55), C.arrow, 0.04);
  scene.add(r);
  return r;
});

// Queue: a glass tray in front, head on the left
const QX0 = -2.6, QDX = 1.05, QY = -2.75, QZ = 2.2;
const trayMat = new THREE.MeshBasicMaterial({ color: C.violet, transparent: true, opacity: 0, toneMapped: false, depthWrite: false });
const tray = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.05, 1.2), trayMat);
tray.position.set(QX0 + 1.5 * QDX, QY - 0.5, QZ); scene.add(tray);
const qLabel = textSprite('queue', C.violet, 0.42, 'Segoe UI'); qLabel.position.set(QX0 - 1.35, QY, QZ); scene.add(qLabel);
const outLabel = textSprite('out', C.magenta, 0.32, 'Segoe UI'); outLabel.position.set(QX0, QY - 0.85, QZ); scene.add(outLabel);

// One queue entry per push: the root at the start, then every child
const entries = [{ node: 0, tin: tInit }];
for (const e of events) if (e.kind === 'push') entries.push({ node: e.node, tin: e.tt });
for (const q of entries) q.tout = events.find((e) => e.kind === 'pop' && e.node === q.node).tt;
entries.forEach((q) => { q.tile = makeTile(NODES[q.node].val, C.yellow, { size: 0.8 }); scene.add(q.tile.g); });

function queueSlot(q, t) {
  // Entries ahead of q that have not left yet (smoothly as they leave)
  let s = 0;
  for (const p of entries) if (p.tin < q.tin) s += 1 - easeInOut(prog(t, p.tout, p.tout + 0.35));
  return s;
}

function nodeState(i, t) {
  const push = i === 0 ? tInit : events.find((e) => e.kind === 'push' && e.node === i).tt;
  const pop = events.find((e) => e.kind === 'pop' && e.node === i).tt;
  return { push, pop };
}

// ---------- camera: slow orbit around the tree ----------
function cameraPose(t) {
  const th = lerp(0.2, -0.18, easeInOut(prog(t, 0, TOTAL)));
  const R = lerp(18.6, 17.4, easeInOut(prog(t, 0, 3))) + 1.2 * easeInOut(prog(t, tFinal - 0.4, tFinal + 1.2));
  return { pos: V(R * Math.sin(th) - 0.3, 4.6, R * Math.cos(th)), look: V(-0.3, 0.4, 0) };
}

function renderAt(t) {
  const p = cameraPose(t);
  st.look(p.pos, p.look);

  // Tree grows in level by level
  orbs.forEach((o, i) => {
    const a = easeOutBack(prog(t, 0.2 + 0.25 * depth[i], 0.65 + 0.25 * depth[i]));
    const { push, pop } = nodeState(i, t);
    let ring = mixColor(LC[depth[i]], C.panel, 0.45).getHex(), scale = a, fill = C.panel;
    if (t >= push) ring = C.yellow;
    if (t >= pop) {
      const u = t - pop;
      ring = mixColor(0xffffff, C.green, prog(u, 0.0, 0.5)).getHex();
      scale = a * (1 + 0.22 * Math.sin(Math.PI * prog(u, 0, 0.5)));
      fill = mixColor(C.panel, C.green, 0.25).getHex();
      const done = levelSpan[depth[i]].t1;
      if (t > done) { ring = mixColor(C.green, LC[depth[i]], prog(t, done, done + 0.5)).getHex(); fill = mixColor(C.panel, LC[depth[i]], 0.2).getHex(); }
    }
    if (t > tFinal) {
      const w = prog(t, tFinal + 0.25 * depth[i], tFinal + 0.5 + 0.25 * depth[i]);
      scale *= 1 + 0.18 * Math.sin(Math.PI * w);
    }
    o.set({ scale, ring, fill });
  });
  rods.forEach((r, i) => { if (r) r.grow(easeInOut(prog(t, 0.45 + 0.25 * (depth[i] - 1), 0.85 + 0.25 * (depth[i] - 1)))); });

  planes.forEach((pl, L) => {
    const { t0, t1 } = levelSpan[L];
    const on = prog(t, t0, t0 + 0.4) * (1 - 0.7 * prog(t, t1, t1 + 0.5));
    const fin = t > tFinal ? 0.35 * Math.sin(Math.PI * prog(t, tFinal + 0.25 * L, tFinal + 0.9 + 0.25 * L)) : 0;
    pl.mat.opacity = 0.05 + 0.17 * on + 0.6 * fin;
    pl.m.visible = t > 0.6;
  });

  // Queue
  const qin = prog(t, 1.3, 1.8);
  trayMat.opacity = 0.35 * qin;
  qLabel.material.opacity = qin;
  outLabel.material.opacity = qin * 0.9;
  for (const q of entries) {
    const from = nodePos(q.node);
    if (t < q.tin) { q.tile.set({ scale: 0 }); continue; }
    const slot = queueSlot(q, t);
    const target = V(QX0 + slot * QDX, QY, QZ);
    const f = easeInOut(prog(t, q.tin, q.tin + 0.5));
    let pos = bezier(from, V((from.x + target.x) / 2 + 0.5, Math.max(from.y, target.y) + 1.0, 1.8), target, f);
    let scale = easeOutBack(prog(t, q.tin, q.tin + 0.35));
    if (t >= q.tout) {
      // Popped: rises back into its node and dissolves
      const g = easeInOut(prog(t, q.tout, q.tout + 0.45));
      pos = bezier(V(QX0, QY, QZ), V(QX0 - 0.6, QY + 2.0, 2.0), from, g);
      scale = 1 - g;
    }
    q.tile.g.position.copy(pos);
    q.tile.set({ scale, ring: t >= q.tout ? C.green : C.yellow });
  }

  st.draw(t, TOTAL);
}

window.renderAt = renderAt;
window.sceneDuration = TOTAL;
</script>
</body>
</html>
