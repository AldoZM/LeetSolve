<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #0B0E1A; overflow: hidden; }</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import { THREE, C, prog, easeInOut, easeOutBack, lerp, V, mixColor, loadTiming, textSprite,
         makeOrb, makeRod, makeStage } from '/vendor/lib/stage.js';

const walk = await (await fetch('/walk.json')).json();
const { seg, total: TOTAL } = await loadTiming(walk.first, walk.last);
const at = (spec) => seg(spec[0]) + spec[1];
const NODES = walk.nodes;
const trace = walk.trace.map((e) => {
  const o = { ...e };
  for (const k of ['visit', 'path', 'best', 'ret', 'drop']) if (e[`t_${k}`]) o[k + 'T'] = at(e[`t_${k}`]);
  return o;
});
const byNode = Object.fromEntries(trace.map((e) => [e.node, e]));
const tFinal = at(walk.final);

const XS = { 0: 0.0, 1: -2.0, 2: 2.0, 3: -3.0, 4: -1.0, 5: 1.0, 6: 3.0 };
const DEPTH = { 0: 0, 1: 1, 2: 1, 3: 2, 4: 2, 5: 2, 6: 2 };
const pos = (i) => V(XS[i] * 1.25, 3.0 - DEPTH[i] * 2.0, 0);

const st = makeStage({ gridY: -2.6, gridX: 0, offset: 0.16, bloom: 0.6 });
const { scene } = st;

const R0 = 0.62;
const orbs = NODES.map((n, i) => { const o = makeOrb(n.val, n.val < 0 ? C.red : C.cyan, { r: R0 }); o.g.position.copy(pos(i)); scene.add(o.g); return o; });
const rods = {};
NODES.forEach((n, i) => {
  if (n.parent === null) return;
  const a = pos(n.parent), b = pos(i), d = b.clone().sub(a).normalize();
  const r = makeRod(a.clone().addScaledVector(d, R0), b.clone().addScaledVector(d, -R0), C.arrow, 0.05);
  scene.add(r);
  rods[i] = r;
});

// Cursor ring around the node being processed
const cursor = new THREE.Mesh(new THREE.TorusGeometry(R0 * 1.35, 0.05, 10, 64), new THREE.MeshBasicMaterial({ color: C.yellow, toneMapped: false, transparent: true }));
scene.add(cursor);

// Gain bubbles: each node reports its gain up its edge; negative gains get dropped to 0
const bubbles = {};
for (const e of trace) {
  if (NODES[e.node].parent === null) continue;
  const g = e.ret;
  const s = textSprite(g >= 0 ? `+${g}` : `${g}`, g >= 0 ? C.green : C.red, 0.62);
  scene.add(s);
  const zero = g < 0 ? textSprite('0', C.muted, 0.62) : null;
  if (zero) scene.add(zero);
  bubbles[e.node] = { s, zero };
}
// Path label above the node while its path is evaluated
const pathLabels = Object.fromEntries(trace.map((e) => {
  const s = textSprite(`path ${e.path}`, e.improved ? C.yellow : C.muted, 0.5, 'Segoe UI');
  s.position.copy(pos(e.node)).add(V(0, R0 + 0.55, 0.3));
  scene.add(s);
  return [e.node, s];
}));
const bestLabel = textSprite('best = 42', C.yellow, 0.95, 'Segoe UI'); bestLabel.position.set(2.5, 4.6, 0.5); scene.add(bestLabel);

function bubblePos(i, f) {
  // From the node toward its parent, ending beside the edge
  const a = pos(i), b = pos(NODES[i].parent);
  const p = a.clone().lerp(b, lerp(0.15, 0.5, f));
  p.x += NODES[i].side === 'L' ? -0.55 : 0.55;
  p.z += 0.7;
  return p;
}

function cursorAt(t) {
  let p = pos(0), k = -1;
  for (const [j, e] of trace.entries()) {
    const f = easeInOut(prog(t, e.visitT - 0.35, e.visitT));
    if (f > 0) { p = p.clone().lerp(pos(e.node), f); k = j; }
  }
  return { p, k };
}

// Used child edges at each node (positive gains only)
const usedEdges = (e) => [e.lkid !== null && e.left > 0 ? e.lkid : null, e.rkid !== null && e.right > 0 ? e.rkid : null].filter((x) => x !== null);

function cameraPose(t) {
  const th = lerp(0.28, -0.25, easeInOut(prog(t, 0, TOTAL)));
  const R = 15.5 + 1.0 * easeInOut(prog(t, tFinal - 0.5, tFinal + 1.0));
  return { pos: V(R * Math.sin(th), 4.4, R * Math.cos(th)), look: V(0, 0.9, 0) };
}

function renderAt(t) {
  const cp = cameraPose(t);
  st.look(cp.pos, cp.look);
  const cur = cursorAt(t);

  // Best so far: the node whose path holds the current best
  let bestNode = null;
  for (const e of trace) if (e.improved && e.bestT !== undefined && t >= e.bestT) bestNode = e;

  orbs.forEach((o, i) => {
    const a = easeOutBack(prog(t, 0.2 + 0.3 * DEPTH[i], 0.7 + 0.3 * DEPTH[i]));
    const e = byNode[i];
    const base = NODES[i].val < 0 ? C.red : C.cyan;
    let ring = base, fill = C.panel, scale = a;
    if (t >= e.pathT) {
      const u = t - e.pathT;
      scale *= 1 + 0.15 * Math.sin(Math.PI * prog(u, 0, 0.5));
      ring = mixColor(base, e.improved ? C.yellow : 0xffffff, prog(u, 0, 0.3)).getHex();
    }
    if (t >= e.retT) ring = mixColor(e.improved ? C.yellow : 0xffffff, C.green, prog(t, e.retT, e.retT + 0.4)).getHex();
    const onBest = bestNode && (bestNode.node === i || usedEdges(bestNode).includes(i));
    if (onBest) { ring = C.yellow; fill = mixColor(C.panel, C.yellow, 0.22).getHex(); }
    if (t > tFinal && walk.best_path.includes(i)) scale *= 1 + 0.12 * Math.sin(Math.PI * prog(t, tFinal + 0.2 * walk.best_path.indexOf(i), tFinal + 0.6 + 0.2 * walk.best_path.indexOf(i)));
    o.set({ scale, ring, fill });
  });

  Object.entries(rods).forEach(([c, r]) => {
    c = Number(c);
    r.grow(easeInOut(prog(t, 0.5 + 0.3 * (DEPTH[c] - 1), 0.9 + 0.3 * (DEPTH[c] - 1))));
    let col = C.arrow;
    const parentE = byNode[NODES[c].parent];
    // While the parent's path is shown, used branches light up
    if (t >= parentE.pathT && t < parentE.retT + 0.2 && usedEdges(parentE).includes(c)) col = parentE.improved ? C.yellow : C.ink;
    if (bestNode && usedEdges(bestNode).includes(c)) col = C.yellow;
    r.material.color.set(col);
    r.scale.x = r.scale.z = col === C.arrow ? 1 : 2.2;
  });

  // Cursor
  cursor.visible = cur.k >= 0 && t < tFinal;
  cursor.position.copy(cur.p);
  cursor.material.opacity = 0.9;

  // Bubbles rise toward the parent and stay until the parent has used them
  for (const [i, b] of Object.entries(bubbles)) {
    const e = byNode[i];
    const parentE = byNode[NODES[i].parent];
    const f = easeInOut(prog(t, e.retT, e.retT + 0.6));
    const gone = prog(t, parentE.retT, parentE.retT + 0.4);
    const p = bubblePos(Number(i), f);
    b.s.position.copy(p);
    const vis = t >= e.retT ? (1 - gone) : 0;
    let sOp = vis;
    if (b.zero) {
      const d = prog(t, e.dropT, e.dropT + 0.4);
      sOp = vis * (1 - d);
      b.zero.position.copy(p);
      b.zero.material.opacity = vis * d;
      b.zero.visible = b.zero.material.opacity > 0.01;
      b.zero.setSize(1 + 0.3 * Math.sin(Math.PI * d));
    }
    b.s.material.opacity = sOp;
    b.s.visible = sOp > 0.01;
    b.s.setSize(easeOutBack(prog(t, e.retT, e.retT + 0.35)));
  }

  // Path labels show from the path event until the node reports up
  for (const e of trace) {
    const s = pathLabels[e.node];
    const op = prog(t, e.pathT, e.pathT + 0.25) * (1 - prog(t, e.retT + 0.3, e.retT + 0.6));
    s.material.opacity = op;
    s.visible = op > 0.01;
  }

  const bIn = easeOutBack(prog(t, tFinal, tFinal + 0.6));
  bestLabel.visible = bIn > 0.001;
  bestLabel.setSize(bIn);

  st.draw(t, TOTAL);
}

window.renderAt = renderAt;
window.sceneDuration = TOTAL;
</script>
</body>
</html>
