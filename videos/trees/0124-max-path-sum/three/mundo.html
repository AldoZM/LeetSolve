<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #A6C8F8; overflow: hidden; }</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import { THREE, prog, easeInOut, easeOut, easeOutBack, lerp, V, pose, mixPose } from '/vendor/lib/stage.js';
import { MC, loadTheme, makeWorld, makeTerrain, makeBlock, makeFrame, pixelSprite, makeOrb, makeClouds, tex } from '/vendor/tema/mc.js';
import { loadMobs, planLife, makeLife, setTime } from '/vendor/tema/vida.js';

const walk = await (await fetch('/walk.json')).json();
// One clip for the whole video: times are absolute. The walk happens in [W0, W1]; the rest is a slow roam that
// ends where it starts, so the video still loops.
const subs = (await (await fetch('/timestamps.json')).json()).subtitles;
const seg = (i) => subs[i].start_s;
const TOTAL = subs[subs.length - 1].end_s;
const W0 = seg(walk.first), W1 = subs[walk.last].end_s;
const at = (spec) => seg(spec[0]) + spec[1];
const nodes = walk.nodes;
const imgs = await loadTheme(['grass_side', 'grass_top', 'dirt', 'planks', 'leaves', 'log_side', 'log_top', 'barrier',
                              ...new Set(nodes.map((n) => `${n.ore}_ore`))]);
const T = { tree: at(walk.tree_in), toast: at(walk.toast), show: at(walk.show) };
const trace = walk.trace.map((e) => ({ ...e, visitT: at(e.t.visit), pathT: at(e.t.path), retT: at(e.t.ret),
  bestT: e.t.best ? at(e.t.best) : null }));
const byNode = {};
trace.forEach((e) => { byNode[e.node] = e; });

// The chain a node offers up (itself plus its better branch, if positive), and the full path through a node
const chain = (i) => {
  if (i === null) return [];
  const e = byNode[i];
  const L = e.lkid !== null && e.left > 0 ? chain(e.lkid) : [], R = e.rkid !== null && e.right > 0 ? chain(e.rkid) : [];
  return [i, ...(e.left >= e.right ? L : R)];
};
const pathOf = (e) => [e.node, ...(e.left > 0 ? chain(e.lkid) : []), ...(e.right > 0 ? chain(e.rkid) : [])];

const world = makeWorld({ fov: 40, offset: 0.34, fog: [55, 120] });
const { scene } = world;
// Terrain of the ClaudeEntorno world (forest with stone in the north, see mundos/lugares.json), turned so the camera looking
// toward -z sees the forest behind the tree; trees and plants are cleared where the camera stands
const terrain = await makeTerrain('/vendor/tema/mundos/stone-forest.json', { turn: -0.3927, plot: [-5, 5, -2, 7], clear: [-10, 10, 7, 24] });
scene.add(terrain);
const clouds = makeClouds(imgs);
scene.add(clouds);
// Dawn at the forest edge: wolves on the prowl, a sheep and a pig nearby
const LIFE = [{ kind: 'wolf', count: 2 }, { kind: 'sheep', count: 1, graze: 1 }, { kind: 'pig', count: 1 }];
await loadMobs(imgs, LIFE.map((g) => g.kind));
const dim = await setTime(world, 'dawn', { terrain, clouds, imgs });
const life = makeLife(imgs, terrain, planLife(terrain, LIFE, { seed: 29 }), TOTAL, dim);
scene.add(life.g);
// Everything of the walk lives in its own group, hidden outside the walk
const stage = new THREE.Group();
scene.add(stage);

// Tree in the plane z = 0: level 0 on top
const Y0 = 4.6, DY = 1.6;
const spot = (i) => V(nodes[i].x, Y0 - nodes[i].lvl * DY, 0);
const rodMat = new THREE.MeshBasicMaterial({ map: tex(imgs, 'planks') });
rodMat.color.setScalar(0.8);
const dropMat = new THREE.MeshBasicMaterial({ color: 0x6a1a1a, transparent: true, opacity: 0.7 });
const rodGeo = new THREE.BoxGeometry(0.12, 0.12, 1);
rodGeo.translate(0, 0, 0.5);
const rods = nodes.map((n, i) => {
  if (n.parent === null) return null;
  const r = new THREE.Mesh(rodGeo, rodMat);
  r.position.copy(spot(n.parent));
  r.lookAt(spot(i));
  r.userData.len = spot(n.parent).distanceTo(spot(i));
  stage.add(r);
  return r;
});
const blocks = nodes.map((n) => { const b = makeBlock(imgs, `${n.ore}_ore`, { label: n.val }); stage.add(b.g); return b; });

// What each node offers its parent: a gold "+gain" above it (red when it will be dropped)
const offers = trace.map((e) => {
  const s = pixelSprite(e.ret > 0 ? `+${e.ret}` : String(e.ret), e.ret > 0 ? MC.gold : MC.red, 0.5);
  stage.add(s);
  return s;
});
const frame = makeFrame(1.04, 0.035, MC.yellow);
stage.add(frame);

// Experience orbs that burst from the best path
let seed = 11;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const orbs = Array.from({ length: 24 }, (_, n) => {
  const o = makeOrb(imgs, 0.34, [1, 2, 4, 5, 6][n % 5]);
  o.userData = { from: walk.best_path[n % 3], vx: (rnd() - 0.5) * 2.4, vy: 2.2 + rnd() * 2.0, vz: (rnd() - 0.3) * 2.0, delay: rnd() * 0.35 };
  stage.add(o);
  return o;
});

// Terrain materials are transparent (alpha-tested) and sorted with the sprites; sprites go last so the ground can't paint over them
stage.traverse((o) => { if (o.isSprite) o.renderOrder = 10; });

function renderAt(t) {
  // Walk camera: front view of the whole tree with a slow drift; roam camera: one slow loop over the meadow
  const sway = 0.5 * Math.sin(t * 0.35);
  const walkPose = pose(V(sway, 4.8, 17), V(sway * 0.4, 4.5, 0.0));
  const a = 2 * Math.PI * t / TOTAL;
  const roamPose = pose(V(6 * Math.sin(a), 3.4 + 0.8 * Math.sin(2 * a), 13 + 2.5 * Math.cos(a)), V(3 * Math.sin(a), 4.2, -30));
  const k = easeInOut(prog(t, W0 - 1.6, W0 - 0.1)) * (1 - easeInOut(prog(t, W1 + 0.1, W1 + 1.6)));
  const cam = mixPose(roamPose, walkPose, k);
  world.look(cam.pos, cam.look);
  // The walk keeps its content high in the frame (the overlay uses the bottom); the roam shows more sky
  world.camera.setViewOffset(world.W, world.H, 0, world.H * lerp(0.12, 0.34, k), world.W, world.H);
  clouds.position.x = 4 * Math.sin(a);
  life.update(t);
  stage.visible = t < W1;

  // The path being scored lights up; the best path so far keeps a soft glow, strong at the end
  const cur = [...trace].reverse().find((e) => t >= e.pathT && t < e.retT + 0.3);
  const lit = new Set(cur ? pathOf(cur) : []);
  const bestE = [...trace].reverse().find((e) => e.bestT !== null && t >= e.bestT);
  const best = new Set(bestE ? pathOf(bestE) : []);
  const fin = prog(t, T.toast, T.toast + 0.4);

  nodes.forEach((n, i) => {
    const d = prog(t, T.tree + 0.12 * i, T.tree + 0.12 * i + 0.5);
    const p = spot(i);
    let glow = lit.has(i) ? 0.35 : 0;
    if (best.has(i)) glow += 0.12 + fin * (0.3 + 0.1 * Math.sin(t * 6));
    const e = byNode[i];
    glow += 0.3 * Math.sin(Math.PI * prog(t, e.visitT - 0.1, e.visitT + 0.4));
    blocks[i].g.position.set(p.x, p.y + (d < 1 ? (1 - d) * (1 - d) * 4 : 0), 0);
    blocks[i].set({ glow, opacity: d > 0 ? 1 : 0 });
    // Rod to the parent: dark red once the parent drops this branch
    if (rods[i]) {
      const g = prog(t, T.tree + 0.12 * i + 0.3, T.tree + 0.12 * i + 0.6);
      rods[i].visible = g > 0;
      rods[i].scale.set(1, 1, Math.max(rods[i].userData.len * g, 1e-4));
      const parent = byNode[n.parent];
      const dropped = e.ret <= 0 && t >= parent.pathT;
      rods[i].material = dropped ? dropMat : rodMat;
    }
  });

  // Offers: appear when a node returns, float above it, fade when the parent has used them
  trace.forEach((e, q) => {
    const s = offers[q];
    const parent = nodes[e.node].parent === null ? null : byNode[nodes[e.node].parent];
    const end = parent ? parent.retT + 0.4 : T.show;
    const v = easeOutBack(prog(t, e.retT, e.retT + 0.35)) * (1 - prog(t, end, end + 0.3));
    s.visible = v > 0.01 && nodes[e.node].parent !== null;
    s.setSize(v);
    const p = spot(e.node);
    s.position.set(p.x, p.y + 0.85, 0.3);
  });

  // Frame on the node being visited
  const v = [...trace].reverse().find((e) => t >= e.visitT);
  frame.visible = !!v && t < T.toast;
  if (v) frame.position.copy(spot(v.node));

  // Orbs burst from the best path
  for (const o of orbs) {
    const { from: i, vx, vy, vz, delay } = o.userData;
    const u = t - (T.toast + delay);
    o.visible = u > 0 && u < 1.6;
    if (!o.visible) continue;
    const p = spot(i);
    o.position.set(p.x + vx * u, Math.max(p.y + vy * u - 4.5 * u * u, 0.1), vz * u);
    o.tint(t + delay);
    o.material.opacity = 1 - prog(u, 1.2, 1.6);
  }

  world.draw(t, TOTAL, 0, 0);
}

window.renderAt = renderAt;
window.sceneDuration = TOTAL;
</script>
</body>
</html>
