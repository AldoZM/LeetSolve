<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #A6C8F8; overflow: hidden; }</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import { THREE, prog, easeInOut, easeOut, easeOutBack, lerp, V, pose, mixPose } from '/vendor/lib/stage.js';
import { MC, loadTheme, makeWorld, makeTerrain, makeBlock, makeFrame, makeSign, pixelSprite, makeOrb, makeClouds } from '/vendor/tema/mc.js';
import { loadMobs, planLife, makeLife, setTime } from '/vendor/tema/vida.js';

const walk = await (await fetch('/walk.json')).json();
// One clip for the whole video: times are absolute. The walk happens in [W0, W1]; the rest is a slow roam that
// ends where it starts, so the video still loops.
const subs = (await (await fetch('/timestamps.json')).json()).subtitles;
const seg = (i) => subs[i].start_s;
const TOTAL = subs[subs.length - 1].end_s;
const W0 = seg(walk.first), W1 = subs[walk.last].end_s;
const at = (spec) => seg(spec[0]) + spec[1];
const imgs = await loadTheme(['grass_side', 'grass_top', 'dirt', 'planks', 'leaves', 'log_side', 'log_top',
                              ...walk.ores.map((o) => `${o}_ore`)]);

const N = walk.nums.length;
const steps = walk.steps.map((s) => ({ ...s, fixT: s.fix ? at(s.fix) : null, visitT: at(s.visit), sumT: at(s.sum_t),
  judgeT: at(s.judge), moveT: s.move_t ? at(s.move_t) : null }));
const T = { row: at(walk.row_in), stays: at(walk.stays), toast: at(walk.toast), names: walk.names.map(at) };
const BEST = [1, 2, 3];   // the closest triple, 2 + 3 + 4 = 9

const world = makeWorld({ fov: 40, offset: 0.34, fog: [55, 120] });
const { scene } = world;
// Terrain of the ClaudeEntorno world (pond in front of a birch wood, see mundos/lugares.json)
const terrain = await makeTerrain('/vendor/tema/mundos/birch-pond.json', { turn: 3.1416, plot: [-5, 5, -2, 7], clear: [-10, 10, 7, 24] });
scene.add(terrain);
const clouds = makeClouds(imgs);
scene.add(clouds);
// Dawn by the pond: cows and sheep on the grass, squid in the water
const LIFE = [{ kind: 'cow', count: 2, graze: 1 }, { kind: 'sheep', count: 2, graze: 1 }, { kind: 'squid', count: 2 }];
await loadMobs(imgs, LIFE.map((g) => g.kind));
const dim = await setTime(world, 'dawn', { terrain, clouds, imgs });
const life = makeLife(imgs, terrain, planLife(terrain, LIFE, { seed: 16 }), TOTAL, dim);
scene.add(life.g);
// Everything of the walk lives in its own group, hidden outside the walk
const stage = new THREE.Group();
scene.add(stage);

// The sorted row, one ore per value
const SP = 1.2;
const bx = (i) => (i - (N - 1) / 2) * SP;
const g0 = terrain.groundAt(0, 0);
const blocks = walk.nums.map((v, i) => {
  const b = makeBlock(imgs, `${walk.ores[i]}_ore`, { label: v });
  stage.add(b.g);
  return b;
});

// The three pointers: i (fixed block), L and R, each with a colored outline and its letter in front of the block
const PINK = 0xFF55FF;
const marks = [['i', MC.gold], ['L', MC.aqua], ['R', PINK]].map(([c, col]) => {
  const s = pixelSprite(c, col, 0.55);
  const f = makeFrame(1.05, 0.045, col);
  stage.add(s, f);
  return { s, f };
});

// One floating sum per step, above the three chosen blocks: green when it beats the best, red when it does not
const sums = steps.map((s) => {
  const sp = pixelSprite(String(s.sum), s.better ? MC.green : MC.red, 0.62);
  stage.add(sp);
  return sp;
});

// The best-so-far sign on a post in front of the row: one board per value it takes
const bestVals = steps.filter((s) => s.better).map((s) => ({ v: s.best, t: s.judgeT }));
const signs = bestVals.map(({ v }) => {
  const g = makeSign(imgs, ['best', String(v)], { w: 2.0, h: 1.0 });
  stage.add(g);
  return g;
});
const SIGN = V(0, terrain.groundAt(0, 4.5) + 1.1, 4.5);

const goldFrames = BEST.map(() => { const f = makeFrame(1.07, 0.05, MC.gold); stage.add(f); return f; });

// Experience orbs that burst from the answer
let seed = 16;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const orbs = Array.from({ length: 26 }, (_, k) => {
  const o = makeOrb(imgs, 0.34, [1, 2, 4, 5, 6][k % 5]);
  o.userData = { from: BEST[k % 3], vx: (rnd() - 0.5) * 2.6, vy: 2.6 + rnd() * 2.2, vz: (rnd() - 0.3) * 2.0, delay: rnd() * 0.35 };
  stage.add(o);
  return o;
});

// Terrain materials are transparent (alpha-tested) and sorted with the sprites; sprites go last so the ground can't paint over them
stage.traverse((o) => { if (o.isSprite) o.renderOrder = 10; });

// Pointer keyframes: every fix places all three, every move slides one pointer by one block
const keys = [];
for (const s of steps) {
  if (s.fixT !== null) keys.push({ t: s.fixT, p: [s.i, s.l, s.r] });
  if (s.moveT !== null) keys.push({ t: s.moveT, p: [s.i, s.move === 'L' ? s.l + 1 : s.l, s.move === 'R' ? s.r - 1 : s.r] });
}
function pointers(t) {
  let p = keys[0].p.map(bx);
  for (const k of keys) {
    const u = easeInOut(prog(t, k.t, k.t + 0.3));
    p = p.map((x, j) => lerp(x, bx(k.p[j]), u));
  }
  return p;
}

function renderAt(t) {
  // Walk camera: wide front view with a slow drift, a small push in for the answer
  const push = easeInOut(prog(t, T.toast - 0.3, T.toast + 0.8));
  const sway = 0.5 * Math.sin(t * 0.35);
  const walkPose = pose(V(sway, lerp(6.6, 6.3, push), lerp(15.0, 14.3, push)), V(sway * 0.4, 1.6, 0.0));
  // Roam camera: one slow loop over the meadow for the whole video
  const a = 2 * Math.PI * t / TOTAL;
  const roamPose = pose(V(6 * Math.sin(a), 3.4 + 0.8 * Math.sin(2 * a), 13 + 2.5 * Math.cos(a)), V(3 * Math.sin(a), 4.2, -30));
  const k = easeInOut(prog(t, W0 - 1.6, W0 - 0.1)) * (1 - easeInOut(prog(t, W1 + 0.1, W1 + 1.6)));
  const cam = mixPose(roamPose, walkPose, k);
  world.look(cam.pos, cam.look);
  // The walk keeps its content high in the frame (the overlay uses the bottom); the roam shows more sky
  world.camera.setViewOffset(world.W, world.H, 0, world.H * lerp(0.12, 0.34, k), world.W, world.H);
  clouds.position.x = 4 * Math.sin(a);
  life.update(t);
  stage.visible = t < W1;

  // The current step: the last one whose sum has been said
  let cur = null;
  for (const s of steps) if (t >= s.sumT) cur = s;
  const fin = easeOutBack(prog(t, T.toast, T.toast + 0.5));

  // Blocks drop in one after another, glow when the voice names them, and the chosen three glow at each sum
  blocks.forEach((b, i) => {
    const d = prog(t, T.row + 0.12 * i, T.row + 0.12 * i + 0.55);
    const fall = d < 1 ? (1 - d) * (1 - d) * 4.5 : 0;
    const bounce = d >= 0.75 ? 0.18 * Math.sin(Math.PI * prog(d, 0.75, 1)) : 0;
    let glow = 0.35 * Math.sin(Math.PI * prog(t, T.names[i] - 0.1, T.names[i] + 0.45));
    if (cur && [cur.i, cur.l, cur.r].includes(i)) glow = Math.max(glow, 0.3 * Math.sin(Math.PI * prog(t, cur.sumT - 0.05, cur.sumT + 0.5)));
    const win = BEST.includes(i) ? fin : 0;
    glow = Math.max(glow, 0.3 * win + 0.12 * Math.sin(t * 6) * win);
    b.g.position.set(bx(i), g0 + 0.5 + fall + bounce + 0.45 * win, 0);
    b.set({ glow: Math.max(glow, 0), opacity: d > 0 ? 1 : 0 });
  });

  // Pointers: outlines on their blocks, letters in front; L and R sit side by side when they meet
  const p = pointers(t);
  const pIn = prog(t, keys[0].t - 0.05, keys[0].t + 0.25);
  const pOut = 1 - prog(t, T.toast - 0.1, T.toast + 0.3);
  const meet = Math.max(0, 1 - Math.abs(p[1] - p[2]) / SP);
  marks.forEach((m, j) => {
    const a = pIn * pOut;
    m.s.visible = m.f.visible = a > 0.01;
    m.f.position.set(p[j], g0 + 0.5, 0);
    m.f.userData.mat.opacity = 0.9 * a;
    m.s.position.set(p[j] + (j === 1 ? -0.22 : j === 2 ? 0.22 : 0) * meet, g0 + 0.32, 1.0);
    m.s.material.opacity = a;
  });

  // The sum floats above the three chosen blocks until the next step
  steps.forEach((s, j) => {
    const next = j + 1 < steps.length ? (steps[j + 1].fixT ?? steps[j + 1].sumT) - 0.1 : T.toast - 0.1;
    const end = s.moveT !== null ? Math.min(next, s.moveT + 0.1) : next;
    const a = easeOutBack(prog(t, s.sumT, s.sumT + 0.25)) * (1 - prog(t, end, end + 0.15));
    sums[j].visible = a > 0.01;
    sums[j].setSize(a);
    sums[j].position.set((bx(s.i) + bx(s.l) + bx(s.r)) / 3, g0 + 1.55 + 0.05 * Math.sin(t * 3), 0.2);
  });

  // Best sign: each new best replaces the board with a bounce; it pulses when nine stays
  const keep = Math.sin(Math.PI * prog(t, T.stays, T.stays + 0.6));
  signs.forEach((g, j) => {
    const t0 = bestVals[j].t, t1 = j + 1 < signs.length ? bestVals[j + 1].t : 1e9;
    const a = easeOutBack(prog(t, t0, t0 + 0.3)) * (1 - prog(t, t1, t1 + 0.12));
    g.visible = a > 0.01;
    const last = j === signs.length - 1;
    g.scale.setScalar(Math.max(a * (1 + (last ? 0.15 * keep + 0.12 * fin : 0)), 1e-4));
    g.position.copy(SIGN);
  });

  // The closest triple: gold outlines when the advancement pops
  goldFrames.forEach((f, j) => {
    const a = prog(t, T.toast + 0.12 * j, T.toast + 0.12 * j + 0.3);
    f.visible = a > 0.01;
    f.position.copy(blocks[BEST[j]].g.position);
    f.userData.mat.opacity = a;
  });

  // Orbs: a short ballistic burst from the closest triple
  for (const o of orbs) {
    const { from: i, vx, vy, vz, delay } = o.userData;
    const u = t - (T.toast + 0.1 + delay);
    o.visible = u > 0 && u < 1.6;
    if (!o.visible) continue;
    o.position.set(bx(i) + vx * u, Math.max(g0 + 1.35 + vy * u - 4.5 * u * u, g0 + 0.1), vz * u);
    o.tint(t + delay);
    o.material.opacity = 1 - prog(u, 1.2, 1.6);
  }

  world.draw(t, TOTAL, 0, 0);
}

window.renderAt = renderAt;
window.sceneDuration = TOTAL;
</script>
</body>
</html>
