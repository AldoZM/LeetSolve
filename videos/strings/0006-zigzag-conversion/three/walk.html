<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #0B0E1A; overflow: hidden; }</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import { THREE, C, prog, easeInOut, easeOutBack, lerp, V, bezier, mixColor, loadTiming, textSprite,
         makeTile, makeStage, pose, poseTrack, drift } from '/vendor/lib/stage.js';

const walk = await (await fetch('/walk.json')).json();
const { seg, total: TOTAL } = await loadTiming(walk.first, walk.last);
const at = (spec) => seg(spec[0]) + spec[1];
const R = walk.rows;
const letters = walk.letters.map((e) => ({ ...e, t0: at(e.t), tt: e.tturn ? at(e.tturn) : null }));
const glowT = walk.glow.map(at), tJoin = at(walk.join), tFinal = at(walk.final);
const ROWC = [C.cyan, C.violet, C.green];

// Slot of each letter inside its row (the row strings are packed)
const count = new Array(R).fill(0);
letters.forEach((e) => { e.slot = count[e.row]++; });
// Position in the joined answer
let pos = 0;
for (let r = 0; r < R; r++) letters.filter((e) => e.row === r).forEach((e) => { e.final = pos++; });

const COL = 1.1, ROWY = [2.4, 1.1, -0.2];
const slotX = (k) => k * COL;
const MID = slotX(6) / 2;
const QY = -1.75, QZ = 1.6, QX0 = -0.4, QDX = 1.0;
const FY = -1.7, FDX = 0.8;
const CX = 2.05;  // center of the whole layout (rail on the left to the end of the rows)
const finalX = (k) => CX - (letters.length - 1) * FDX / 2 + k * FDX;

const st = makeStage({ gridY: -2.6, gridX: MID, offset: 0.2, bloom: 0.6 });
const { scene } = st;

// Row trays: a glass shelf under each row with a label
const trays = ROWY.map((y, r) => {
  const mat = new THREE.MeshBasicMaterial({ color: ROWC[r], transparent: true, opacity: 0.0, toneMapped: false, depthWrite: false });
  const m = new THREE.Mesh(new THREE.BoxGeometry(slotX(6) + 1.6, 0.06, 1.3), mat);
  m.position.set(MID, y - 0.62, 0); scene.add(m);
  const lab = textSprite(`rows[${r}]`, ROWC[r], 0.4, 'Segoe UI'); lab.position.set(-1.5, y, 0); scene.add(lab);
  return { m, mat, lab };
});

const tiles = letters.map((e) => { const t = makeTile(e.ch, C.ink, { size: 0.9 }); scene.add(t.g); return t; });

// Pointer: an orb on a rail at the left, with a cone showing the direction
const railMat = new THREE.MeshBasicMaterial({ color: C.muted, transparent: true, toneMapped: false });
const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, ROWY[0] - ROWY[2] + 0.6, 8), railMat);
rail.position.set(-2.75, (ROWY[0] + ROWY[2]) / 2, 0); scene.add(rail);
const ptr = new THREE.Group();
const orbMat = new THREE.MeshBasicMaterial({ color: C.yellow, toneMapped: false, transparent: true });
const orb = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 12), orbMat);
const cone = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.34, 16), orbMat);
cone.position.x = -0.5;
ptr.add(orb, cone); ptr.position.x = -2.75; scene.add(ptr);
const turnRing = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.04, 8, 48), new THREE.MeshBasicMaterial({ color: C.magenta, toneMapped: false, transparent: true }));
scene.add(turnRing);

function pointerState(t) {
  // Row the pointer sits on and the current direction (+1 down, -1 up)
  let y = ROWY[0], dir = 1, flash = 0;
  for (const [k, e] of letters.entries()) {
    const next = letters[k + 1];
    if (e.tt !== null) {
      const f = easeInOut(prog(t, e.tt, e.tt + 0.3));
      dir = lerp(dir, e.row === R - 1 ? -1 : 1, f);
      const u = t - e.tt;
      if (u > 0 && u < 0.6) flash = Math.max(flash, Math.sin(Math.PI * u / 0.6));
    }
    if (next) {
      const go = (e.tt ?? e.t0 + 0.55) + 0.05;
      y = lerp(y, ROWY[next.row], easeInOut(prog(t, Math.max(go, e.t0 + 0.55), Math.max(go, e.t0 + 0.55) + 0.3)));
    }
  }
  return { y, dir, flash };
}

// ---------- camera ----------
const main = pose(V(CX + 0.7, 4.4, 19.5), V(CX + 0.25, 0.4, 0));
const wide = pose(V(CX, 3.8, 23.0), V(CX, -0.3, 0));
function cameraPose(t) {
  return drift(poseTrack(t, [[0, wide], [2.0, main, 1.6], [tJoin - 0.4, wide, 1.4]]), t, 0.3, 0.15);
}

function renderAt(t) {
  const p = cameraPose(t);
  st.look(p.pos, p.look);

  trays.forEach((tr, r) => {
    const a = prog(t, 0.3 + 0.25 * r, 0.8 + 0.25 * r);
    const g = glowT[r];
    const pulse = Math.sin(Math.PI * prog(t, g, g + 0.8));
    tr.mat.opacity = a * (0.25 + 0.35 * pulse) * (1 - 0.6 * prog(t, tJoin, tJoin + 0.6));
    tr.lab.material.opacity = a * (1 - prog(t, tJoin, tJoin + 0.4));
  });

  // Letters: wait in the queue, fly to their row, then join the answer line
  let placed = 0;
  for (const e of letters) if (t >= e.t0) placed++;
  letters.forEach((e, k) => {
    const tile = tiles[k];
    const qi = k - placed;  // position in the queue while waiting
    const appear = easeOutBack(prog(t, 1.2 + 0.06 * k, 1.6 + 0.06 * k));
    let x, y, z, scale = appear, ring = C.muted;
    if (t < e.t0) {
      // Slide forward smoothly as the queue advances
      let shift = 0;
      for (const q of letters) if (q.k < k) shift += easeInOut(prog(t, q.t0, q.t0 + 0.35));
      const slot = k - shift;
      x = QX0 + slot * QDX; y = QY; z = QZ;
      scale *= slot < 8 ? 1 : 1 - prog(slot, 8, 9);
      if (qi === 0) ring = C.yellow;
    } else {
      const f = easeInOut(prog(t, e.t0, e.t0 + 0.55));
      const from = V(QX0, QY, QZ), to = V(slotX(e.slot), ROWY[e.row], 0);
      const mid = V((from.x + to.x) / 2 - 1.0, Math.max(from.y, to.y) + 1.6, 1.4);
      const pp = bezier(from, mid, to, f);
      x = pp.x; y = pp.y; z = pp.z;
      ring = mixColor(C.yellow, ROWC[e.row], prog(t, e.t0 + 0.4, e.t0 + 0.7)).getHex();
      const g = glowT[e.row];
      const pulse = Math.sin(Math.PI * prog(t, g, g + 0.8));
      scale = 1 + 0.12 * pulse;
      // Join: rows stream down into one line, row 0 first
      const j0 = tJoin + 0.08 * e.final;
      const jf = easeInOut(prog(t, j0, j0 + 0.7));
      if (jf > 0) {
        const pj = bezier(V(x, y, z), V((x + finalX(e.final)) / 2, y + 1.2, 1.5), V(finalX(e.final), FY, 1.0), jf);
        x = pj.x; y = pj.y; z = pj.z;
        scale = lerp(scale, 0.85, jf);
      }
      if (t > tFinal) {
        const w = prog(t, tFinal + 0.05 * e.final, tFinal + 0.35 + 0.05 * e.final);
        y += Math.sin(Math.PI * w) * 0.3;
      }
    }
    tile.g.position.set(x, y, z);
    tile.set({ scale, ring });
  });

  // Pointer
  const ps = pointerState(t);
  const pin = prog(t, 2.6, 3.0) * (1 - prog(t, tJoin, tJoin + 0.4));
  ptr.position.y = ps.y;
  ptr.visible = pin > 0.001;
  orbMat.opacity = pin;
  railMat.opacity = 0.6 * pin;
  rail.visible = pin > 0.001;
  cone.position.set(0, -0.48 * ps.dir, 0);
  cone.rotation.z = ps.dir > 0 ? Math.PI : 0;
  cone.scale.setScalar(Math.max(Math.abs(ps.dir), 0.05));
  orbMat.color.set(mixColor(C.yellow, C.magenta, (1 - ps.dir) / 2));
  turnRing.position.set(-2.75, ps.y, 0);
  turnRing.scale.setScalar(1 + ps.flash * 0.8);
  turnRing.material.opacity = ps.flash;
  turnRing.visible = ps.flash > 0.01;

  st.draw(t, TOTAL);
}

window.renderAt = renderAt;
window.sceneDuration = TOTAL;
</script>
</body>
</html>
