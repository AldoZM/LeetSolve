<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #A6C8F8; overflow: hidden; }</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import { THREE, prog, easeInOut, easeOutBack, lerp, V, bezier, pose, mixPose } from '/vendor/lib/stage.js';
import { MC, loadTheme, makeWorld, makeTerrain, makeBlock, makeFrame, makeOrb, makeClouds, tex } from '/vendor/tema/mc.js';
import { loadMobs, planLife, makeLife, setTime } from '/vendor/tema/vida.js';

const walk = await (await fetch('/walk.json')).json();
// One clip for the whole video: times are absolute. The walk happens in [W0, W1]; the rest is a slow roam that
// ends where it starts, so the video still loops.
const subs = (await (await fetch('/timestamps.json')).json()).subtitles;
const seg = (i) => subs[i].start_s;
const TOTAL = subs[subs.length - 1].end_s;
const W0 = seg(walk.first), W1 = subs[walk.last].end_s;
const at = (spec) => seg(spec[0]) + spec[1];
const imgs = await loadTheme(['grass_side', 'grass_top', 'dirt', 'planks', 'leaves', 'log_side', 'log_top', 'barrier',
                              'stone', 'redstone_ore', 'iron_ore', 'emerald_ore']);

const S = walk.s;
const T = { rowIn: at(walk.row_in), seven: at(walk.seven), toast: at(walk.toast), apply: at(walk.apply), answer: at(walk.answer_t) };
const names = walk.names.map(at);
const steps = walk.steps.map((s) => ({ ...s, visitT: at(s.visit), skipT: s.skip ? at(s.skip) : null, signT: s.sign_t ? at(s.sign_t) : null,
  pushT: s.push ? at(s.push) : null, stopT: s.stop_t ? at(s.stop_t) : null }));
const signStep = steps.find((s) => s.kind === 'sign');
const stopStep = steps.find((s) => s.kind === 'stop');
const digitSteps = steps.filter((s) => s.kind === 'digit');

const world = makeWorld({ fov: 40, offset: 0.34, fog: [55, 120] });
const { scene } = world;
// Terrain of the ClaudeEntorno world (river with a sandy bank and low hills, see mundos/lugares.json); the ground
// rises toward the camera, so the leveled lot reaches it; the tall grass in front of the row is cleared too
const terrain = await makeTerrain('/vendor/tema/mundos/river-sand.json', { turn: 0.7854, plot: [-12, 12, -2, 20], clear: [-10, 10, 1, 24] });
scene.add(terrain);
const clouds = makeClouds(imgs);
scene.add(clouds);
// Day by the river: cows, sheep and chickens on the banks, squid in the water
const LIFE = [{ kind: 'cow', count: 2, graze: 1 }, { kind: 'sheep', count: 2 }, { kind: 'chicken', count: 1 }, { kind: 'squid', count: 2 }];
await loadMobs(imgs, LIFE.map((g) => g.kind));
const dim = await setTime(world, 'day', { terrain, clouds, imgs });
const life = makeLife(imgs, terrain, planLife(terrain, LIFE, { seed: 8 }), TOTAL, dim);
scene.add(life.g);
// Everything of the walk lives in its own group, hidden outside the walk
const stage = new THREE.Group();
scene.add(stage);

// Eight columns: the string up in the air, the parsed number lands on the ground below it
const SZ = 0.68, SP = 0.76;
const cx = (i) => (i - 3.5) * SP;
const YX = 2.3, YR = SZ / 2;
const groundY = (i) => YR + terrain.groundAt(cx(i), 0);
const chars = S.split('').map((c, i) => {
  const b = makeBlock(imgs, walk.looks[i], { label: c === ' ' ? null : c, size: SZ });
  stage.add(b.g);
  return b;
});
// The result digits (emerald), one per push; each lands on its column of the answer
const RES_COL = [3, 3, 4];
const res = digitSteps.map((s) => { const b = makeBlock(imgs, 'emerald_ore', { label: s.d, size: SZ }); stage.add(b.g); return b; });

// The pointer: the game's block outline, yellow, around the character being read
const frame = makeFrame(SZ * 1.08, 0.035, MC.yellow);
stage.add(frame);
// The letter stops the reading: a barrier pops up above it
const barrier = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex(imgs, 'barrier'), transparent: true, depthWrite: false }));
stage.add(barrier);

// Experience orbs when the string is parsed
let seed = 13;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const orbs = Array.from({ length: 22 }, (_, n) => {
  const o = makeOrb(imgs, 0.32, [1, 2, 4, 5, 6][n % 5]);
  o.userData = { vx: (rnd() - 0.5) * 2.4, vy: 2.2 + rnd() * 2.0, vz: (rnd() - 0.3) * 2.0, delay: rnd() * 0.35 };
  stage.add(o);
  return o;
});

// Terrain materials are transparent (alpha-tested) and sorted with the sprites; sprites go last so the ground can't paint over them
stage.traverse((o) => { if (o.isSprite) o.renderOrder = 10; });

const blink = (t, a, b) => Math.sin(Math.PI * prog(t, a, b));
// Arc from the row down to a column on the ground
const fly = (from, to, f) => bezier(V(cx(from), YX, 0), V((cx(from) + cx(to)) / 2, YX + 0.9, 0.7), V(cx(to), groundY(to), 0), easeInOut(f));

function renderAt(t) {
  // Walk camera: front view of the row with a slow drift; roam camera: one slow loop over the meadow
  const sway = 0.5 * Math.sin(t * 0.35);
  const walkPose = pose(V(sway * 0.3, 4.8, 15.9), V(sway * 0.1, 3.4, 0.0));
  const a = 2 * Math.PI * t / TOTAL;
  const roamPose = pose(V(6 * Math.sin(a), 3.4 + 0.8 * Math.sin(2 * a), 13 + 2.5 * Math.cos(a)), V(3 * Math.sin(a), 4.2, -30));
  const k = easeInOut(prog(t, W0 - 1.6, W0 - 0.1)) * (1 - easeInOut(prog(t, W1 + 0.1, W1 + 1.6)));
  const cam = mixPose(roamPose, walkPose, k);
  world.look(cam.pos, cam.look);
  // The walk keeps its content high in the frame (the overlay uses the bottom); the roam shows more sky
  world.camera.setViewOffset(world.W, world.H, 0, world.H * lerp(0.12, 0.34, k), world.W, world.H);
  clouds.position.x = 4 * Math.sin(a);
  life.update(t);
  stage.visible = t < W1;
  // Everything shrinks away as the walk ends, with the overlay
  const gone = prog(t, W1 - 0.5, W1);
  const sc = Math.max(1 - gone, 1e-4);

  // The string drops in, then each character lights up as the narration names it
  chars.forEach((b, i) => {
    const d = prog(t, T.rowIn + 0.1 * i, T.rowIn + 0.1 * i + 0.45);
    const fall = d < 1 ? (1 - d) * (1 - d) * 4 : 0;
    let x = cx(i), y = YX + fall, glow = 0.45 * blink(t, names[i] - 0.1, names[i] + 0.4), show = d > 0;
    const st = steps.find((s) => s.i === i);
    if (st) {
      glow += 0.3 * blink(t, st.visitT - 0.05, st.visitT + 0.35);
      if (st.kind === 'space') {
        // Skipped spaces go dark and sink a little
        const f = easeInOut(prog(t, st.skipT, st.skipT + 0.35));
        glow -= 0.5 * f;
        y -= 0.22 * f;
      } else if (st.kind === 'sign') {
        glow += 0.6 * blink(t, st.signT - 0.1, st.signT + 0.6);
        // Applying the sign: the minus flies down in front of the number
        const f = prog(t, T.apply, T.apply + 0.55);
        if (f > 0) { const p = fly(i, 2, f); x = p.x; y = p.y; }
        glow += 0.5 * blink(t, T.answer - 0.1, T.answer + 0.6);
      } else if (st.kind === 'digit') {
        // Pushed: the digit flies down and becomes the next emerald of the result
        const f = prog(t, st.pushT - 0.5, st.pushT);
        if (f > 0) { const p = fly(i, RES_COL[digitSteps.indexOf(st)], f); x = p.x; y = p.y; show = show && f < 1; }
      } else if (st.kind === 'stop') {
        glow += 0.4 * blink(t, st.stopT - 0.1, st.stopT + 0.5);
      }
    }
    // The seven is never read: it fades back
    if (i === S.length - 1) glow -= 0.5 * prog(t, T.seven, T.seven + 0.4);
    b.g.position.set(x, y, 0);
    b.g.scale.setScalar(sc);
    b.set({ glow, opacity: show && gone < 1 ? 1 : 0 });
  });

  // Result digits: 0 lands first, then shrinks away when the 4 takes its place (0 x 10 + 4 = 4); then the 2
  res.forEach((b, j) => {
    const st = digitSteps[j];
    const on = t >= st.pushT;
    const next = digitSteps[j + 1];
    let s = sc;
    if (j === 0 && next) s *= 1 - easeInOut(prog(t, next.pushT - 0.3, next.pushT));
    const glow = 0.5 * blink(t, st.pushT, st.pushT + 0.5) + 0.5 * blink(t, T.answer - 0.1, T.answer + 0.6);
    b.g.position.set(cx(RES_COL[j]), groundY(RES_COL[j]), 0);
    b.g.scale.setScalar(Math.max(s, 1e-4));
    b.set({ glow, opacity: on && s > 0.01 ? 1 : 0 });
  });

  // The pointer slides from character to character; red once it stops on the letter, gone when the sign is applied
  let fi = -1, fx = 0;
  for (const s of steps) {
    if (t < s.visitT) break;
    const from = fi < 0 ? s.i : fi;
    fx = lerp(cx(from), cx(s.i), easeInOut(prog(t, s.visitT, s.visitT + 0.22)));
    fi = s.i;
  }
  const fOut = prog(t, T.apply - 0.3, T.apply);
  frame.visible = fi >= 0 && fOut < 1;
  frame.position.set(fx, YX - (fi === 0 || fi === 1 ? 0.22 * easeInOut(prog(t, steps[fi].skipT, steps[fi].skipT + 0.35)) : 0), 0);
  frame.scale.setScalar(Math.max(sc * (1 - fOut), 1e-4));
  frame.userData.mat.color.setHex(stopStep && t >= stopStep.stopT ? MC.red : MC.yellow);

  // The barrier above the letter when the reading stops
  const bIn = stopStep ? easeOutBack(prog(t, stopStep.stopT, stopStep.stopT + 0.4)) : 0;
  const bHit = stopStep ? blink(t, stopStep.stopT + 0.4, stopStep.stopT + 1.0) : 0;
  barrier.visible = bIn > 0.01;
  barrier.position.set(cx(stopStep.i), YX + 0.85, 0.1);
  barrier.scale.setScalar(Math.max(0.62 * bIn * (1 + 0.3 * bHit) * sc, 1e-4));

  // Orbs burst from the answer at the advancement
  for (const o of orbs) {
    const { vx, vy, vz, delay } = o.userData;
    const u = t - (T.toast + delay);
    o.visible = u > 0 && u < 1.6;
    if (!o.visible) continue;
    o.position.set(cx(3.5) + vx * u * 0.7, Math.max(YR + 0.6 + vy * u - 4.5 * u * u, 0.1), vz * u);
    o.tint(t + delay);
    o.material.opacity = 1 - prog(u, 1.2, 1.6);
  }

  world.draw(t, TOTAL, 0, 0);
}

window.renderAt = renderAt;
window.sceneDuration = TOTAL;
</script>
</body>
</html>
