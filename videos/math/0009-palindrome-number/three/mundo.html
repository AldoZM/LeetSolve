<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #A6C8F8; overflow: hidden; }</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import { THREE, prog, easeInOut, easeOut, easeOutBack, lerp, V, bezier, pose, mixPose } from '/vendor/lib/stage.js';
import { MC, loadTheme, makeWorld, makeTerrain, makeBlock, makeFrame, pixelSprite, makeOrb, makeClouds } from '/vendor/tema/mc.js';
import { loadMobs, planLife, makeLife, setTime } from '/vendor/tema/vida.js';

const walk = await (await fetch('/walk.json')).json();
// One clip for the whole video: times are absolute. The walk happens in [W0, W1]; the rest is a slow roam that
// ends where it starts, so the video still loops.
const subs = (await (await fetch('/timestamps.json')).json()).subtitles;
const seg = (i) => subs[i].start_s;
const TOTAL = subs[subs.length - 1].end_s;
const W0 = seg(walk.first), W1 = subs[walk.last].end_s;
const at = (spec) => seg(spec[0]) + spec[1];
const imgs = await loadTheme(['grass_side', 'grass_top', 'dirt', 'planks', 'leaves', 'log_side', 'log_top',
                              'iron_ore', 'gold_ore']);

const T = { rowIn: at(walk.row_in), zero: at(walk.zero), stop: at(walk.stop), middle: at(walk.middle),
            drop: at(walk.drop), equal: at(walk.equal), toast: at(walk.toast) };
const steps = walk.steps.map((s) => ({ ...s, popT: at(s.pop), xT: at(s.x_t), halfT: at(s.half_t) }));

const world = makeWorld({ fov: 40, offset: 0.34, fog: [55, 120] });
const { scene } = world;
// Open lake of the west with sugar cane (see mundos/lugares.json), turned so the camera looking toward -z sees the water
const terrain = await makeTerrain('/vendor/tema/mundos/west-lake.json', { turn: 5.8905, plot: [-5, 5, -2, 7], clear: [-10, 10, 7, 24] });
scene.add(terrain);
const clouds = makeClouds(imgs);
scene.add(clouds);
// Dusk by the lake: farm animals on the shore and squids in the water
const LIFE = [{ kind: 'cow', count: 2, graze: 1 }, { kind: 'sheep', count: 2, graze: 1 }, { kind: 'chicken', count: 2 },
              { kind: 'squid', count: 2 }];
await loadMobs(imgs, LIFE.map((g) => g.kind));
const light = await setTime(world, 'dusk', { terrain, clouds, imgs });
const life = makeLife(imgs, terrain, planLife(terrain, LIFE, { seed: 9 }), TOTAL, light);
scene.add(life.g);
// Everything of the walk lives in its own group, hidden outside the walk
const stage = new THREE.Group();
scene.add(stage);

// Five columns: x = 12321 floats on top, the reversed half grows on the ground from the left
const SZ = 0.86, SP = 1.0;
const cx = (i) => (i - 2) * SP + 0.35;
const YX = 2.5, YH = SZ / 2;
const xs = String(walk.x).split('').map(Number);
const N = xs.length;
const xb = xs.map((v) => { const b = makeBlock(imgs, 'iron_ore', { label: v, size: SZ }); stage.add(b.g); return b; });
// Half block k is the digit popped by step k
const hb = steps.map((s) => { const b = makeBlock(imgs, 'gold_ore', { label: s.d, size: SZ }); stage.add(b.g); return b; });

// Row names on the left
const xLab = pixelSprite('x', MC.white, 0.5);
const hLab = pixelSprite('half', MC.gold, 0.42);
stage.add(xLab, hLab);

// Yellow outline on the digit about to be popped; green outlines on the two matching halves at the end
const sel = makeFrame(SZ + 0.08, 0.05, MC.yellow);
stage.add(sel);
const greens = [0, 1, 2, 3].map(() => { const f = makeFrame(SZ + 0.08, 0.05, MC.green); stage.add(f); return f; });

// Experience orbs at the end
let seed = 19;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const orbs = Array.from({ length: 22 }, (_, n) => {
  const o = makeOrb(imgs, 0.32, [1, 2, 4, 5, 6][n % 5]);
  o.userData = { vx: (rnd() - 0.5) * 2.6, vy: 2.2 + rnd() * 2.0, vz: (rnd() - 0.3) * 2.0, delay: rnd() * 0.35 };
  stage.add(o);
  return o;
});

// Terrain materials are transparent (alpha-tested) and sorted with the sprites; sprites go last so the ground can't paint over them
stage.traverse((o) => { if (o.isSprite) o.renderOrder = 10; });

const flyEnd = (s) => Math.min(s.halfT, s.popT + 1.3);

function renderAt(t) {
  // Walk camera: front view of both rows with a slow drift; roam camera: one slow loop over the meadow
  const sway = 0.5 * Math.sin(t * 0.35);
  const walkPose = pose(V(sway * 0.3, 4.5, 13.2), V(sway * 0.1, 2.75, 0.0));
  const a = 2 * Math.PI * t / TOTAL;
  const roamPose = pose(V(6 * Math.sin(a), 3.4 + 0.8 * Math.sin(2 * a), 13 + 2.5 * Math.cos(a)), V(3 * Math.sin(a), 4.2, -30));
  const k = easeInOut(prog(t, W0 - 1.6, W0 - 0.1)) * (1 - easeInOut(prog(t, W1 + 0.1, W1 + 1.6)));
  const cam = mixPose(roamPose, walkPose, k);
  world.look(cam.pos, cam.look);
  // The walk keeps its content high in the frame (the overlay uses the bottom); the roam shows more sky
  world.camera.setViewOffset(world.W, world.H, 0, world.H * lerp(0.12, 0.34, k), world.W, world.H);
  clouds.position.x = 4 * Math.sin(a);
  life.update(t);
  stage.visible = t < W1;
  if (!stage.visible) { world.draw(t, TOTAL, 0, 0); return; }

  const g0 = terrain.groundAt(0, 0);
  // Labels come in with the row
  const labIn = easeOutBack(prog(t, T.rowIn, T.rowIn + 0.5));
  xLab.position.set(cx(-1) + 0.2, YX + g0, 0);
  xLab.setSize(labIn);
  xLab.visible = labIn > 0.01;
  const hIn = easeOutBack(prog(t, T.zero, T.zero + 0.5));
  hLab.position.set(cx(-1) - 0.1, YH + g0, 0);
  hLab.setSize(hIn);
  hLab.visible = hIn > 0.01;

  // x digits: drop in one by one; the last three are popped, each flies to its spot in the half
  xb.forEach((b, i) => {
    const d = prog(t, T.rowIn + 0.15 * i, T.rowIn + 0.15 * i + 0.45);
    const fall = d < 1 ? (1 - d) * (1 - d) * 4 : 0;
    const kpop = N - 1 - i;
    const s = steps[kpop];
    let show = d > 0;
    let glow = 0;
    let x = cx(i), y = YX + fall + g0, z = 0;
    if (s) {
      glow = 0.45 * Math.sin(Math.PI * prog(t, s.popT - 0.1, s.popT + 0.35));
      const f = prog(t, s.popT + 0.15, flyEnd(s));
      if (f > 0) {
        const p = bezier(V(x, YX + g0, 0), V((x + cx(kpop)) / 2, YX + 1.3 + g0, 0.8), V(cx(kpop), YH + g0, 0), easeInOut(f));
        x = p.x; y = p.y; z = p.z;
        show = f < 1;
      }
    }
    // The two left digits light up green at the end
    if (i < 2) glow += 0.4 * Math.sin(Math.PI * prog(t, T.equal, T.equal + 0.7));
    b.g.position.set(x, y, z);
    b.set({ glow, opacity: show ? 1 : 0 });
  });

  // Half digits: appear where the flight lands, glow when the voice reads the half
  hb.forEach((b, j) => {
    const s = steps[j];
    const on = t >= flyEnd(s);
    let glow = 0.5 * Math.sin(Math.PI * prog(t, s.halfT, s.halfT + 0.6));
    // "Now the half is bigger": the whole half flashes
    glow += 0.35 * Math.sin(Math.PI * prog(t, T.stop, T.stop + 0.8));
    let x = cx(j), y = YH + g0, z = 0, sc = 1;
    if (j === 2) {
      // The middle digit: glows when named, then hops off and vanishes (half // 10)
      glow += 0.6 * Math.sin(Math.PI * prog(t, T.middle, T.middle + 0.9));
      const f = prog(t, T.drop + 0.1, T.drop + 0.9);
      if (f > 0) {
        x += 0.9 * f;
        y += 1.4 * Math.sin(Math.PI * Math.min(f * 0.8, 1));
        z = -0.6 * f;
        sc = 1 - easeInOut(prog(f, 0.4, 1));
      }
    } else {
      glow += 0.4 * Math.sin(Math.PI * prog(t, T.equal, T.equal + 0.7));
    }
    b.g.position.set(x, y, z);
    b.g.scale.setScalar(Math.max(sc, 1e-4));
    b.set({ glow, opacity: on && sc > 0.01 ? 1 : 0 });
  });

  // The yellow outline sits on the last digit of x while the loop runs, and hides while a digit flies
  const popped = steps.filter((s) => t >= s.popT + 0.15).length;
  const flying = steps.some((s) => t >= s.popT + 0.1 && t < flyEnd(s) + 0.2);
  sel.visible = t >= T.zero && t < T.stop + 0.3 && !flying && popped < N;
  sel.position.set(cx(N - 1 - popped), YX + g0, 0);
  const selPulse = 1 + 0.06 * Math.sin(Math.PI * steps.reduce((m, s) => Math.max(m, prog(t, s.popT - 0.3, s.popT + 0.1)), 0));
  sel.scale.setScalar(selPulse);

  // Green outlines on 12 (x) and 12 (half) when they match
  const gIn = easeOutBack(prog(t, T.equal, T.equal + 0.4));
  greens.forEach((f, n) => {
    f.visible = gIn > 0.01;
    f.position.set(cx(n % 2), (n < 2 ? YX : YH) + g0, 0);
    f.scale.setScalar(Math.max(gIn, 1e-4));
  });

  // Orbs burst between the two rows when the advancement pops
  for (const o of orbs) {
    const { vx, vy, vz, delay } = o.userData;
    const u = t - (T.toast + delay);
    o.visible = u > 0 && u < 1.6;
    if (!o.visible) continue;
    o.position.set(cx(0.5) + vx * u * 0.7, Math.max(YX - 0.6 + vy * u - 4.5 * u * u, 0.1) + g0, vz * u + 0.5);
    o.tint(t + delay);
    o.material.opacity = 1 - prog(u, 1.2, 1.6);
  }

  world.draw(t, TOTAL, 0, 0);
}

window.renderAt = renderAt;
window.sceneDuration = TOTAL;
</script>
</body>
</html>
