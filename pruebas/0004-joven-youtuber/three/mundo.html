<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #A6C8F8; overflow: hidden; }</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import { THREE, prog, easeInOut, easeOut, easeOutBack, lerp, V, pose, mixPose } from '/vendor/lib/stage.js';
import { MC, loadTheme, makeWorld, makeTerrain, makeBlock, pixelSprite, makeOrb, makeClouds } from '/vendor/tema/mc.js';
import { loadMobs, planLife, makeLife, setTime } from '/vendor/tema/vida.js';

const walk = await (await fetch('/walk.json')).json();
// One clip for the whole video: times are absolute. The walk happens in [W0, W1]; the rest is a slow roam that
// ends where it starts, so the video still loops.
const subs = (await (await fetch('/timestamps.json')).json()).subtitles;
const seg = (i) => subs[i].start_s;
const TOTAL = subs[subs.length - 1].end_s;
const W0 = seg(walk.first), W1 = subs[walk.last].end_s;
const at = (spec) => seg(spec[0]) + spec[1];
const imgs = await loadTheme(['grass_side', 'grass_top', 'dirt', 'planks', 'leaves', 'log_side', 'log_top', 'gold_ore', 'diamond_ore']);

const steps = walk.steps.map((s) => ({ ...s, cutAT: at(s.cutA), cutBT: at(s.cutB), chk1T: at(s.chk1), chk2T: at(s.chk2),
  sidesT: s.sides ? at(s.sides) : null, moveT: s.move ? at(s.move) : null, validT: s.valid ? at(s.valid) : null }));
const T = { row: at(walk.row_in), range: at(walk.range), toast: at(walk.toast), largest: at(walk.largest) };
const last = steps[steps.length - 1];

const world = makeWorld({ fov: 40, offset: 0.34, fog: [55, 120] });
const { scene } = world;
// Terrain of the ClaudeEntorno world (terraced hill in the east, see mundos/lugares.json), turned so the camera looking
// toward -z sees the hill behind the rows; trees and plants are cleared where the camera stands
const terrain = await makeTerrain('/vendor/tema/mundos/terraced-hill.json', { turn: 1.9635, plot: [-5, 5, -2, 7], clear: [-10, 10, 7, 24] });
scene.add(terrain);
const clouds = makeClouds(imgs);
scene.add(clouds);
// Dusk on the terraced hill: cows, a pig and chickens
const LIFE = [{ kind: 'cow', count: 2, graze: 1 }, { kind: 'pig', count: 1 }, { kind: 'chicken', count: 2 }];
await loadMobs(imgs, LIFE.map((g) => g.kind));
const dim = await setTime(world, 'dusk', { terrain, clouds, imgs });
const life = makeLife(imgs, terrain, planLife(terrain, LIFE, { seed: 13 }), TOTAL, dim);
scene.add(life.g);
// Everything of the walk lives in its own group, hidden outside the walk
const stage = new THREE.Group();
scene.add(stage);

// A floats above B; the same column index lines up in both rows
const SP = 1.15, GAP = 0.5;
const bx = (k) => (k - 2.5) * SP;
const YA = 2.2, YB = 0.5;
const rowA = walk.a.map((v) => { const b = makeBlock(imgs, 'gold_ore', { label: v }); stage.add(b.g); return b; });
const rowB = walk.b.map((v) => { const b = makeBlock(imgs, 'diamond_ore', { label: v }); stage.add(b.g); return b; });

// The cut: a glowing red pane in the gap; blocks left of it slide left, blocks right of it slide right
const paneMat = new THREE.MeshBasicMaterial({ color: MC.red, toneMapped: false, transparent: true, opacity: 0.85 });
const pane = () => { const m = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.35, 1.1), paneMat); stage.add(m); return m; };
const paneA = pane(), paneB = pane();

// Possible cut spots in A (0 to 5), shown while the range is explained; ruled out ones turn gray
const ticks = [0, 1, 2, 3, 4, 5].map((k) => { const s = pixelSprite(String(k), MC.yellow, 0.45); stage.add(s); return s; });

// The two checks across the cut: L1 -> R2 and L2 -> R1, green when they hold, red when they don't
const beamGeo = new THREE.BoxGeometry(0.13, 0.13, 1);
beamGeo.translate(0, 0, 0.5);
const beams = [0, 1].map(() => {
  const m = new THREE.Mesh(beamGeo, new THREE.MeshBasicMaterial({ color: MC.green, toneMapped: false, transparent: true }));
  stage.add(m);
  return m;
});
const sideLab = pixelSprite('left half: 6', MC.white, 0.42);
stage.add(sideLab);

// Experience orbs that burst from the median
let seed = 11;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const orbs = Array.from({ length: 22 }, (_, k) => {
  const o = makeOrb(imgs, 0.34, [1, 2, 4, 5, 6][k % 5]);
  o.userData = { vx: (rnd() - 0.5) * 2.4, vy: 2.4 + rnd() * 2.0, vz: (rnd() - 0.3) * 2.0, delay: rnd() * 0.35 };
  stage.add(o);
  return o;
});

// Terrain materials are transparent (alpha-tested) and sorted with the sprites; sprites go last so the ground can't paint over them
stage.traverse((o) => { if (o.isSprite) o.renderOrder = 10; });

// Cut positions over time (fractional while sliding), and how open the gap is
function cuts(t) {
  let i = steps[0].i, j = steps[0].j;
  for (let k = 1; k < steps.length; k++) {
    i = lerp(i, steps[k].i, easeInOut(prog(t, steps[k].cutAT - 0.1, steps[k].cutAT + 0.5)));
    j = lerp(j, steps[k].j, easeInOut(prog(t, steps[k].cutBT - 0.1, steps[k].cutBT + 0.5)));
  }
  const openA = easeOutBack(prog(t, steps[0].cutAT, steps[0].cutAT + 0.4));
  const openB = easeOutBack(prog(t, steps[0].cutBT, steps[0].cutBT + 0.4));
  return { i, j, openA, openB };
}

// x of block k when the cut sits at c: shifted by half the gap away from the cut
const shifted = (k, c, open) => bx(k) + (k < c ? -1 : 1) * 0.5 * GAP * open * Math.min(1, Math.abs(k + 0.5 - c) * 2);

function renderAt(t) {
  // Walk camera: front view of both rows with a slow drift; roam camera: one slow loop over the meadow
  const sway = 0.5 * Math.sin(t * 0.35);
  const walkPose = pose(V(sway, 5.4, 15.5), V(sway * 0.4, 3.4, 0.0));
  const a = 2 * Math.PI * t / TOTAL;
  const roamPose = pose(V(6 * Math.sin(a), 3.4 + 0.8 * Math.sin(2 * a), 13 + 2.5 * Math.cos(a)), V(3 * Math.sin(a), 4.2, -30));
  const k = easeInOut(prog(t, W0 - 1.6, W0 - 0.1)) * (1 - easeInOut(prog(t, W1 + 0.1, W1 + 1.6)));
  const cam = mixPose(roamPose, walkPose, k);
  world.look(cam.pos, cam.look);
  // The walk keeps its content high in the frame (the overlay uses the bottom); the roam shows more sky
  world.camera.setViewOffset(world.W, world.H, 0, world.H * lerp(0.12, 0.34, k), world.W, world.H);
  clouds.position.x = 4 * Math.sin(a);
  life.update(t);
  stage.visible = t < W1;

  const c = cuts(t);
  const ci = Math.round(c.i), cj = Math.round(c.j);
  const sides = steps[0].sidesT;
  const sideGlow = 0.3 * Math.sin(Math.PI * prog(t, sides, sides + 1.2));
  const fin = prog(t, T.toast, T.toast + 0.4);

  // Rows drop in from above, A first; the left half glows when it is counted
  const layA = rowA.map((b, i) => ({ b, i })), layB = rowB.map((b, i) => ({ b, i }));
  layA.forEach(({ b, i }) => {
    const d = prog(t, T.row + 0.1 * i, T.row + 0.1 * i + 0.55);
    b.g.position.set(shifted(i, c.i, c.openA), YA + (d < 1 ? (1 - d) * (1 - d) * 4.5 : 0), 0);
    let glow = i < ci ? sideGlow : 0;
    glow += checkGlow(t, 'A', i);
    b.set({ glow, opacity: d > 0 ? 1 : 0 });
  });
  layB.forEach(({ b, i }) => {
    const d = prog(t, T.row + 0.6 + 0.1 * i, T.row + 0.6 + 0.1 * i + 0.55);
    // The median lifts out of the row
    const lift = i === last.j - 1 ? easeOutBack(prog(t, T.largest, T.largest + 0.5)) : 0;
    b.g.position.set(shifted(i, c.j, c.openB), YB + 0.45 * lift + (d < 1 ? (1 - d) * (1 - d) * 4.5 : 0), 0);
    let glow = i < cj ? sideGlow : 0;
    glow += checkGlow(t, 'B', i);
    if (lift > 0) glow += 0.35 * lift + 0.12 * Math.sin(t * 6) * lift;
    b.set({ glow, opacity: d > 0 ? 1 : 0 });
  });

  // Cut panes in the middle of the gap
  const paneX = (row, cut, open) => {
    const lo = Math.floor(cut), f = cut - lo;
    const at = (q) => (q <= 0 ? bx(0) - 0.85 : q >= row.length ? bx(row.length - 1) + 0.85 : (bx(q - 1) + bx(q)) / 2);
    return lerp(at(lo), at(lo + 1), f);
  };
  paneA.visible = c.openA > 0.01;
  paneA.position.set(paneX(rowA, c.i), YA, 0);
  paneA.scale.set(1, Math.max(c.openA, 1e-4), 1);
  paneB.visible = c.openB > 0.01;
  paneB.position.set(paneX(rowB, c.j), YB + terrain.groundAt(0, 0), 0);
  paneB.scale.set(1, Math.max(c.openB, 1e-4), 1);
  paneMat.color.set(fin > 0 ? MC.gold : MC.red);

  // Range ticks above the gaps of A; the ruled-out ones (left of the first try) gray out after the move
  const rIn = prog(t, T.range, T.range + 0.4) * (1 - prog(t, last.validT, last.validT + 0.5));
  ticks.forEach((s, q) => {
    s.visible = rIn > 0.01;
    s.material.opacity = rIn;
    const at = q === 0 ? bx(0) - 0.85 : q === 5 ? bx(4) + 0.85 : (bx(q - 1) + bx(q)) / 2;
    s.position.set(at, YA + 1.05, 0);
    const out = steps[0].moveT !== null && t > steps[0].moveT && q <= steps[0].i;
    s.material.color.set(out ? 0x888888 : 0xffffff);
    s.material.opacity = rIn * (out ? 0.55 : 1);
  });

  // Check beams: drawn from the left block to the right block across the cut
  const showBeam = (m, from, to, ok, t0, t1) => {
    const v = easeOut(prog(t, t0, t0 + 0.35)) * (1 - prog(t, t1, t1 + 0.3));
    m.visible = v > 0.01;
    if (!m.visible) return;
    m.material.color.set(ok ? MC.green : MC.red);
    m.position.copy(from);
    m.lookAt(to);
    m.scale.set(1 + 0.3 * Math.sin(t * 12), 1 + 0.3 * Math.sin(t * 12), Math.max(from.distanceTo(to) * v, 1e-4));
  };
  let shown = [false, false];
  steps.forEach((s, n) => {
    const end = n + 1 < steps.length ? steps[n + 1].cutAT - 0.3 : T.toast + 0.8;
    const pA = (q) => rowA[q].g.position.clone(), pB = (q) => rowB[q].g.position.clone();
    if (t >= s.chk1T && t < end + 0.3) { showBeam(beams[0], pA(s.i - 1).add(V(0.3, -0.35, 0.55)), pB(s.j).add(V(-0.3, 0.35, 0.55)), s.ok1, s.chk1T, end); shown[0] = true; }
    if (t >= s.chk2T && t < end + 0.3) { showBeam(beams[1], pB(s.j - 1).add(V(0.3, 0.35, 0.6)), pA(s.i).add(V(-0.3, -0.35, 0.6)), s.ok2, s.chk2T, end); shown[1] = true; }
  });
  beams.forEach((m, q) => { if (!shown[q]) m.visible = false; });

  // "left half: 6" label while the sides are counted
  const sl = Math.sin(Math.PI * prog(t, sides - 0.1, sides + 1.8));
  sideLab.visible = sl > 0.01;
  sideLab.setSize(Math.min(1, sl * 1.5));
  sideLab.position.set(bx(1), YA + 1.65, 0);

  // Orbs burst from the median block
  const med = rowB[last.j - 1].g.position;
  for (const o of orbs) {
    const { vx, vy, vz, delay } = o.userData;
    const u = t - (T.largest + delay);
    o.visible = u > 0 && u < 1.6;
    if (!o.visible) continue;
    o.position.set(med.x + vx * u, Math.max(med.y + 0.6 + vy * u - 4.5 * u * u, 0.1), vz * u);
    o.tint(t + delay);
    o.material.opacity = 1 - prog(u, 1.2, 1.6);
  }

  world.draw(t, TOTAL, 0, 0);
}

// Short flash on the blocks being compared
function checkGlow(t, row, q) {
  let g = 0;
  for (const s of steps) {
    if (row === 'A' && q === s.i - 1) g += 0.35 * Math.sin(Math.PI * prog(t, s.chk1T, s.chk1T + 0.8));
    if (row === 'B' && q === s.j) g += 0.35 * Math.sin(Math.PI * prog(t, s.chk1T, s.chk1T + 0.8));
    if (row === 'B' && q === s.j - 1) g += 0.35 * Math.sin(Math.PI * prog(t, s.chk2T, s.chk2T + 0.8));
    if (row === 'A' && q === s.i) g += 0.35 * Math.sin(Math.PI * prog(t, s.chk2T, s.chk2T + 0.8));
  }
  return g;
}

window.renderAt = renderAt;
window.sceneDuration = TOTAL;
</script>
</body>
</html>
